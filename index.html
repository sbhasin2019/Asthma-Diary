<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Zoya — Asthma</title>
<meta name="theme-color" content="#1C7C88" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Zoya Asthma" />
<link id="appicon" rel="apple-touch-icon" />
<link id="favicon" rel="icon" />
<link id="mani" rel="manifest" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&display=swap');

:root{
  --bg:#EAF1F1; --surface:#FFFFFF; --ink:#15292E; --muted:#5E7378; --faint:#8AA0A4;
  --line:#D8E4E4; --teal:#1C7C88; --teal-deep:#13565F; --teal-soft:#E2F0F0;
  --green:#3E9D7B; --mild:#3E9D7B; --moderate:#E0913A; --severe:#D2543F; --sky:#6FB0BD;
  --shadow:0 1px 2px rgba(20,40,45,.04), 0 6px 18px rgba(20,40,45,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;background:var(--bg);}
#root{min-height:100%;}
body, body *{font-family:'Inter',system-ui,-apple-system,sans-serif;}
.app{background:var(--bg);min-height:100%;display:flex;justify-content:center;color:var(--ink);}
.phone{width:100%;max-width:440px;min-height:100vh;position:relative;display:flex;flex-direction:column;}

.screen{flex:1;padding:max(26px,env(safe-area-inset-top)) 20px 96px;display:flex;flex-direction:column;gap:18px;animation:fade .35s ease;}
.loading{align-items:center;justify-content:center;gap:12px;color:var(--muted);height:100vh;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.head{margin-top:4px;}
.eyebrow{font-size:12.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--teal);font-weight:600;margin:0 0 3px;}
.title{font-family:'Fraunces',serif;font-weight:500;font-size:32px;line-height:1.04;margin:0;letter-spacing:-.01em;}

.ring-area{display:flex;justify-content:center;padding:6px 0 2px;}
.ring-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;}
.ring-wrap.pulsing{animation:breathe 4.5s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@media (prefers-reduced-motion: reduce){.ring-wrap.pulsing{animation:none}}
.ring{width:200px;height:200px;}
.ring-track{fill:none;stroke:var(--line);stroke-width:13;}
.ring-prog{fill:none;stroke:var(--teal);stroke-width:13;stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1);}
.ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;}
.ring-num{font-family:'Fraunces',serif;font-size:54px;font-weight:500;line-height:1;color:var(--ink);}
.ring-den{font-size:26px;color:var(--faint);}
.ring-check{color:var(--green);}
.ring-cap{font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em;}

.doses{display:flex;flex-direction:column;gap:10px;}
.dose{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:14px 15px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .12s ease, border-color .2s, background .2s;width:100%;font:inherit;color:inherit;}
.dose:active{transform:scale(.985);}
.dose-ic{width:38px;height:38px;border-radius:11px;background:var(--teal-soft);color:var(--teal-deep);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dose-text{display:flex;flex-direction:column;flex:1;min-width:0;}
.dose-label{font-weight:600;font-size:15px;}
.dose-detail{font-size:13px;color:var(--muted);margin-top:1px;}
.dose-check{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.empty-dot{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);}
.dose.done{background:#F1F8F4;border-color:#CDE7DB;}
.dose.done .dose-ic{background:#DCF0E6;color:var(--green);}
.dose.done .dose-check{background:var(--green);color:#fff;}
.dose.due{border-color:var(--moderate);box-shadow:0 0 0 3px rgba(224,145,58,.12),var(--shadow);}
.dose.due .dose-detail{color:var(--moderate);font-weight:600;}
.all-done{font-size:13.5px;color:var(--green);text-align:center;margin:2px 0 0;font-weight:500;}

.primary{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:#fff;
  border:none;border-radius:14px;padding:15px;font-size:15.5px;font-weight:600;cursor:pointer;width:100%;
  box-shadow:0 4px 14px rgba(28,124,136,.28);transition:transform .12s, background .2s;font-family:inherit;}
.primary:active{transform:scale(.98);background:var(--teal-deep);}
.log-btn{margin-top:2px;}
.ghost{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.ghost:active{transform:scale(.98);}

.section-h{font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin:0 0 11px;letter-spacing:-.01em;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);}

.today-eps{display:flex;flex-direction:column;}
.ep-list{display:flex;flex-direction:column;}
.ep-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;text-align:left;width:100%;
  box-shadow:var(--shadow);transition:transform .12s;font:inherit;color:inherit;}
.ep-row:active{transform:scale(.99);}
.ep-sev{width:9px;height:38px;border-radius:5px;flex-shrink:0;}
.ep-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ep-top{display:flex;align-items:baseline;gap:8px;}
.ep-sev-label{font-weight:600;font-size:14.5px;}
.ep-when{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.ep-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ep-edit{color:var(--faint);flex-shrink:0;}
.ep-pin{vertical-align:-1px;color:var(--teal);}
.empty{font-size:14px;color:var(--muted);padding:6px 2px;}

.strip{display:flex;justify-content:space-between;gap:3px;}
.strip-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.dosebar{width:100%;max-width:20px;height:9px;border-radius:3px;background:var(--line);}
.dosebar.both{background:var(--green);}
.dosebar.one{background:var(--moderate);}
.dosebar.none{background:var(--severe);}
.dosebar.pre{background:var(--line);opacity:.45;}
.strip-day{font-size:10.5px;color:var(--faint);}
.strip-day.lev{color:var(--severe);font-weight:700;}
.ep-dot{width:5px;height:5px;border-radius:50%;background:transparent;}
.ep-dot.on{background:var(--teal);}

.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
.leg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.leg-bar{width:16px;height:8px;border-radius:3px;display:inline-block;}
.leg-bar.both{background:var(--green);}
.leg-bar.one{background:var(--moderate);}
.leg-bar.none{background:var(--severe);}
.leg-date{font-size:12px;font-weight:700;color:var(--severe);}
.leg-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;}

.geo-btn{display:flex;align-items:center;gap:7px;align-self:flex-start;background:var(--teal-soft);
  color:var(--teal-deep);border:none;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;
  cursor:pointer;margin-top:2px;font-family:inherit;}
.geo-btn:active{transform:scale(.97);}
.geo-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:12.5px;color:var(--ink);margin-top:2px;}
.geo-chip > span:first-child{display:flex;align-items:center;gap:5px;}
.geo-acc{color:var(--faint);}
.geo-links{display:flex;gap:12px;flex-shrink:0;}
.geo-links a,.geo-links button{font-size:12.5px;font-weight:600;color:var(--teal);background:none;
  border:none;cursor:pointer;text-decoration:none;padding:0;font-family:inherit;}
.geo-note{font-size:12px;color:var(--moderate);margin:2px 0 0;line-height:1.45;}

.range-row{display:flex;gap:8px;}
.range-chip{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 0;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
.range-chip.sel{background:var(--ink);border-color:var(--ink);color:#fff;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
.stat{display:flex;flex-direction:column;gap:3px;}
.stat-big{grid-column:1 / -1;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:1px;}
.stat-val{font-family:'Fraunces',serif;font-weight:600;font-size:25px;line-height:1;color:var(--teal-deep);}
.stat-big .stat-val{font-size:40px;color:var(--teal);}
.stat-lab{font-size:12.5px;color:var(--muted);}

.sev-bars{display:flex;flex-direction:column;gap:9px;}
.sev-line{display:flex;align-items:center;gap:10px;}
.sev-name{font-size:13px;width:74px;color:var(--ink);}
.sev-track{flex:1;height:9px;background:var(--bg);border-radius:6px;overflow:hidden;}
.sev-fill{display:block;height:100%;border-radius:6px;transition:width .5s;}
.sev-n{font-size:13px;font-weight:600;width:18px;text-align:right;color:var(--muted);}
.meta-line{font-size:13px;color:var(--muted);margin:11px 0 0;line-height:1.5;}
.meta-line strong{color:var(--ink);font-weight:600;}

.spark{width:100%;height:96px;display:block;}
.spark-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;}

.report-actions{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;}
.report-preview{background:#FBFDFD;}
.report-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6;
  color:var(--ink);white-space:pre-wrap;word-break:break-word;margin:0;}

.backup-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.backup-note{font-size:12px;color:var(--faint);line-height:1.5;margin:11px 0 0;}

.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;height:74px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:none;color:var(--faint);font-size:11px;font-weight:600;cursor:pointer;padding-top:11px;font-family:inherit;}
.tab.on{color:var(--teal);}

.sheet-scrim{position:fixed;inset:0;background:rgba(20,40,45,.34);display:flex;align-items:flex-end;
  justify-content:center;z-index:50;animation:fade .2s ease;}
.sheet{width:100%;max-width:440px;max-height:92vh;background:var(--bg);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;animation:rise .28s cubic-bezier(.4,0,.2,1);overflow:hidden;}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;
  border-bottom:1px solid var(--line);background:var(--surface);}
.sheet-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin:0;}
.cancel-btn{background:none;border:none;color:var(--muted);font-size:14.5px;font-weight:500;cursor:pointer;padding:8px 4px;font-family:inherit;}
.text-btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.sheet-body{overflow-y:auto;padding:18px 18px 30px;display:flex;flex-direction:column;gap:19px;}

.field{display:flex;flex-direction:column;gap:9px;}
.field-label{font-size:13.5px;font-weight:600;color:var(--ink);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;
  font-size:13.5px;color:var(--ink);cursor:pointer;font-weight:500;transition:all .15s;font-family:inherit;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.sev-chip{display:flex;align-items:center;gap:7px;}
.sev-dot{width:9px;height:9px;border-radius:50%;}
.sev-chip.on .sev-dot{background:#fff !important;}

.stepper{display:flex;align-items:center;gap:0;width:fit-content;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
.stepper button{width:48px;height:46px;border:none;background:var(--surface);font-size:22px;color:var(--teal);cursor:pointer;font-weight:500;font-family:inherit;}
.stepper button:active{background:var(--teal-soft);}
.stepper span{width:54px;text-align:center;font-size:18px;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);height:46px;line-height:46px;}

.dt-input,.num-input,.notes-input{font-family:'Inter',sans-serif;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;color:var(--ink);width:100%;}
.num-input{width:140px;}
.notes-input{resize:none;line-height:1.5;}
.dt-input:focus,.num-input:focus,.notes-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}

.delete-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:1px solid #EAC9C2;color:var(--severe);border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;font-family:inherit;}
.delete-btn:active{background:#FBF1EF;}

.disclaimer{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--faint);line-height:1.5;margin:8px 2px 0;}
.disclaimer svg{flex-shrink:0;margin-top:2px;}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:80;display:flex;align-items:center;gap:8px;
  max-width:380px;width:calc(100% - 40px);background:var(--ink);color:#fff;border-radius:13px;padding:12px 15px;
  font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(20,40,45,.25);animation:toastIn .25s ease;}
.toast svg{flex-shrink:0;color:#7FD3B0;}
.toast.warn{background:var(--severe);}
.toast.warn svg{color:#fff;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------- config ---------- */
const CHILD = "Zoya";
const STORE_KEY = "asthma_zoya_v1";
const DOSES = [
  { id: "morning", label: "Morning", med: "Foracort", detail: "2 puffs", icon: "sun", dueHour: 7 },
  { id: "evening", label: "Evening", med: "Foracort", detail: "2 puffs", icon: "moon", dueHour: 20 },
];
const SEVERITIES = [
  { id: "mild", label: "Mild", color: "var(--mild)" },
  { id: "moderate", label: "Moderate", color: "var(--moderate)" },
  { id: "severe", label: "Severe", color: "var(--severe)" },

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

/* ---------- storage ---------- */
function loadData() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) return JSON.parse(r); } catch (e) {}
  return { doseLog: {}, episodes: [] };
}
function saveData(d) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); return true; }
  catch (e) { console.error(e); return false; }
}
const clone = (o) => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

const pad = (n) => String(n).padStart(2, "0");

const todayKey = () => keyOf(new Date());

function prettyTime(iso) {
  const d = new Date(iso); let h = d.getHours(); const m = pad(d.getMinutes());
  const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return `${h}:${m} ${ap}`;

/* ---------- icons ---------- */
function Ico({ n, s = 20 }) {

    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>;
    case "moon": return <svg {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" /></svg>;
    case "alert": return <svg {...p}><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" /><path d="M12 9v4M12 17h.01" /></svg>;
    case "pencil": return <svg {...p}><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>;
    case "pin": return <svg {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" /><circle cx="12" cy="10" r="3" /></svg>;
    case "trash": return <svg {...p}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></svg>;
    case "copy": return <svg {...p}><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>;
    case "share": return <svg {...p}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" /></svg>;
    case "clock": return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>;
    case "doc": return <svg {...p}><path d="M6 3h8l4 4v14H6z" /><path d="M14 3v4h4M9 13h6M9 17h6" /></svg>;
    case "download": return <svg {...p}><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>;
    case "upload": return <svg {...p}><path d="M12 21V9M7 14l5-5 5 5M5 3h14" /></svg>;
    default: return null;
  }
}

/* ================= App ================= */
function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("today");
  const [sheet, setSheet] = useState(null);
  const [now, setNow] = useState(new Date());
  const [toast, setToast] = useState(null);

  const showToast = useCallback((msg, warn = false) => {
    setToast({ msg, warn });
    setTimeout(() => setToast(null), warn ? 5000 : 1800);
  }, []);

  useEffect(() => { setData(loadData()); }, []);
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);

  const update = useCallback((mutator, okMsg) => {
    setData((prev) => {
      const next = mutator(clone(prev));
      const ok = saveData(next);
      if (!ok) showToast("Couldn't save to this device — if you're in a private/incognito tab, open the normal link instead.", true);
      else if (okMsg) showToast(okMsg);
      return next;
    });
  }, [showToast]);

  if (!data) return <div className="app"><div className="screen loading"><Ico n="wind" s={28} /><span>Loading…</span></div></div>;

  const tk = todayKey();
  const todayLog = data.doseLog[tk] || {};
  const todayEpisodes = data.episodes.filter((e) => keyOf(new Date(e.at)) === tk).sort((a, b) => new Date(b.at) - new Date(a.at));

  function toggleDose(id) {
    update((d) => {
      const day = d.doseLog[tk] || {};
      if (day[id] && day[id].taken) delete day[id];
      else day[id] = { taken: true, at: new Date().toISOString() };
      d.doseLog[tk] = day; return d;
    });
  }
  function saveEpisode(ep) {
    update((d) => {
      if (ep.id) d.episodes = d.episodes.map((e) => (e.id === ep.id ? ep : e));
      else d.episodes.push({ ...ep, id: "e_" + Date.now() });
      return d;
    }, ep.id ? "Episode updated" : "Episode saved");
    setSheet(null);
  }
  function deleteEpisode(id) {
    update((d) => { d.episodes = d.episodes.filter((e) => e.id !== id); return d; }, "Episode deleted");
    setSheet(null);
  }
  function restoreBackup(obj) {
    if (!obj || typeof obj !== "object" || !("doseLog" in obj) || !("episodes" in obj)) {
      showToast("That file isn't a valid backup", true); return;
    }
    setData(obj); saveData(obj); showToast("Backup restored");
  }

  return (
    <div className="app">
      <div className="phone">
        {tab === "today" && <Today now={now} todayLog={todayLog} todayEpisodes={todayEpisodes} onToggle={toggleDose} onLog={() => setSheet({})} onOpenEpisode={(e) => setSheet({ episode: e })} />}
        {tab === "history" && <History data={data} onOpenEpisode={(e) => setSheet({ episode: e })} />}
        {tab === "summary" && <Summary data={data} onRestore={restoreBackup} showToast={showToast} />}

        <nav className="tabbar">
          <button className={`tab ${tab === "today" ? "on" : ""}`} onClick={() => setTab("today")}><Ico n="wind" s={21} /><span>Today</span></button>
          <button className={`tab ${tab === "history" ? "on" : ""}`} onClick={() => setTab("history")}><Ico n="clock" s={21} /><span>History</span></button>
          <button className={`tab ${tab === "summary" ? "on" : ""}`} onClick={() => setTab("summary")}><Ico n="doc" s={21} /><span>Summary</span></button>
        </nav>
      </div>

      {sheet && <EpisodeSheet existing={sheet.episode} onClose={() => setSheet(null)} onSave={saveEpisode} onDelete={deleteEpisode} />}

      {toast && <div className={`toast ${toast.warn ? "warn" : ""}`}>{toast.warn ? <Ico n="alert" s={16} /> : <Ico n="check" s={16} />}<span>{toast.msg}</span></div>}
    </div>
  );
}

/* ---------- Today ---------- */
function Today({ now, todayLog, todayEpisodes, onToggle, onLog, onOpenEpisode }) {
  const takenCount = DOSES.filter((d) => todayLog[d.id] && todayLog[d.id].taken).length;
  const complete = takenCount === DOSES.length;
  return (
    <div className="screen">
      <header className="head"><p className="eyebrow">{prettyDate(now)}</p><h1 className="title">{CHILD}'s day</h1></header>
      <BreathRing taken={takenCount} total={DOSES.length} />
      <div className="doses">
        {DOSES.map((dose) => {
          const rec = todayLog[dose.id]; const taken = !!(rec && rec.taken);
          const due = !taken && now.getHours() >= dose.dueHour;
          return (
            <button key={dose.id} className={`dose ${taken ? "done" : ""} ${due ? "due" : ""}`} onClick={() => onToggle(dose.id)}>
              <span className="dose-ic"><Ico n={dose.icon} /></span>
              <span className="dose-text">
                <span className="dose-label">{dose.label} · {dose.med}</span>
                <span className="dose-detail">{taken ? `Taken at ${prettyTime(rec.at)}` : `${dose.detail}${due ? " · due now" : ""}`}</span>
              </span>
              <span className="dose-check">{taken ? <Ico n="check" s={18} /> : <span className="empty-dot" />}</span>
            </button>

        })}

        <section className="today-eps">

      )}

    </div>
  );
}

function BreathRing({ taken, total }) {
  const pct = (taken / total) * 100; const complete = taken === total;
  return (
    <div className="ring-area">
      <div className={`ring-wrap ${complete ? "" : "pulsing"}`}>
        <svg viewBox="0 0 180 180" className="ring">
          <circle cx="90" cy="90" r="74" className="ring-track" />
          <circle cx="90" cy="90" r="74" className="ring-prog" pathLength="100" strokeDasharray={`${pct} 100`} transform="rotate(-90 90 90)" />
        </svg>
        <div className="ring-center">
          {complete ? <span className="ring-check"><Ico n="check" s={40} /></span> : <span className="ring-num">{taken}<span className="ring-den">/{total}</span></span>}
          <span className="ring-cap">{complete ? "doses done" : "doses today"}</span>
        </div>
      </div>
    </div>
  );
}

/* ---------- History ---------- */
function History({ data, onOpenEpisode }) {
  const relieverDays = useMemo(() => {
    const s = new Set();
    for (const e of data.episodes) if (Number(e.reliever) > 0) s.add(keyOf(new Date(e.at)));
    return s;
  }, [data]);
  const episodeDays = useMemo(() => {
    const m = {};
    for (const e of data.episodes) { const k = keyOf(new Date(e.at)); m[k] = (m[k] || 0) + 1; }
    return m;
  }, [data]);
  const firstActive = useMemo(() => {
    const keys = [...Object.keys(data.doseLog), ...data.episodes.map((e) => keyOf(new Date(e.at)))].sort();
    return keys.length ? keys[0] : todayKey();
  }, [data]);
  const days = useMemo(() => {
    const out = []; const base = new Date();
    for (let i = 13; i >= 0; i--) {
      const d = new Date(base); d.setDate(base.getDate() - i);
      const k = keyOf(d); const log = data.doseLog[k] || {};
      const taken = DOSES.filter((x) => log[x.id] && log[x.id].taken).length;
      out.push({ d, taken, k, reliever: relieverDays.has(k), episode: !!episodeDays[k], tracked: k >= firstActive });
    }
    return out;
  }, [data, relieverDays, episodeDays, firstActive]);
  const episodes = useMemo(() => [...data.episodes].sort((a, b) => new Date(b.at) - new Date(a.at)), [data]);

  return (
    <div className="screen">
      <header className="head"><p className="eyebrow">Last 14 days</p><h1 className="title">History</h1></header>
      <section className="card">
        <h2 className="section-h">Daily record</h2>
        <div className="strip">
          {days.map(({ d, taken, reliever, episode, tracked }, i) => {
            const cls = !tracked ? "pre" : taken === 2 ? "both" : taken === 1 ? "one" : "none";
            return (
              <div key={i} className="strip-col">
                <span className={`dosebar ${cls}`} />
                <span className={`strip-day ${reliever ? "lev" : ""}`}>{d.getDate()}</span>
                <span className={`ep-dot ${episode ? "on" : ""}`} />
              </div>
            );
          })}
        </div>
        <div className="legend">
          <span className="leg"><span className="leg-bar both" /> Both doses</span>
          <span className="leg"><span className="leg-bar one" /> One dose</span>
          <span className="leg"><span className="leg-bar none" /> None</span>
          <span className="leg"><span className="leg-date">12</span> Levolin used</span>
          <span className="leg"><span className="leg-dot" /> Episode logged</span>
        </div>
      </section>
      <section className="ep-list">
        <h2 className="section-h">Episodes</h2>
        {episodes.length === 0 && <p className="empty">No episodes logged yet. That's good news.</p>}
        {episodes.map((e) => <EpisodeRow key={e.id} ep={e} showDate onClick={() => onOpenEpisode(e)} />)}
      </section>
    </div>
  );
}

/* ---------- Summary ---------- */
const RANGES = [{ id: 7, label: "7 days" }, { id: 30, label: "30 days" }, { id: 90, label: "90 days" }, { id: 0, label: "All" }];

function Summary({ data, onRestore, showToast }) {
  const [range, setRange] = useState(30);
  const [copied, setCopied] = useState(false);
  const fileRef = useRef(null);

  const stats = useMemo(() => computeStats(data, range), [data, range]);
  const text = useMemo(() => buildReport(stats, range), [stats, range]);

  async function copy() {
    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch (e) { showToast("Couldn't copy — select the text below instead", true); }
  }
  async function share() {
    try { if (navigator.share) await navigator.share({ title: `${CHILD} — asthma summary`, text }); else copy(); } catch (e) {}
  }
  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `zoya-asthma-backup-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("Backup downloaded");
    } catch (e) { showToast("Couldn't export backup", true); }
  }
  function onFile(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { const obj = JSON.parse(r.result); if (window.confirm("Replace all current records with this backup file?")) onRestore(obj); }
      catch (err) { showToast("Couldn't read that file", true); }
    };
    r.readAsText(f); e.target.value = "";
  }

  return (
    <div className="screen">
      <header className="head"><p className="eyebrow">For the doctor</p><h1 className="title">Summary</h1></header>
      <div className="range-row">
        {RANGES.map((r) => <button key={r.id} className={`range-chip ${range === r.id ? "sel" : ""}`} onClick={() => setRange(r.id)}>{r.label}</button>)}
      </div>

      <section className="card stat-grid">
        <Stat big value={`${stats.adherence}%`} label="Preventer adherence" />
        <Stat value={`${stats.given}/${stats.expected}`} label="Doses taken" />
        <Stat value={stats.missed} label="Doses missed" />
        <Stat value={stats.episodes.length} label="Episodes" />
        <Stat value={stats.relieverTotal} label="Levolin puffs" />
      </section>

      {stats.episodes.length > 0 && (
        <section className="card">
          <h2 className="section-h">Episodes breakdown</h2>
          <div className="sev-bars">
            {SEVERITIES.map((s) => {
              const n = stats.sevCount[s.id] || 0; const w = stats.episodes.length ? (n / stats.episodes.length) * 100 : 0;
              return (<div key={s.id} className="sev-line"><span className="sev-name">{s.label}</span><span className="sev-track"><span className="sev-fill" style={{ width: `${w}%`, background: s.color }} /></span><span className="sev-n">{n}</span></div>);
            })}
          </div>
          {stats.topActivities.length > 0 && <p className="meta-line"><strong>At onset:</strong> {stats.topActivities.map((a) => `${a[0]} (${a[1]})`).join(", ")}</p>}
          {stats.topSymptoms.length > 0 && <p className="meta-line"><strong>Symptoms:</strong> {stats.topSymptoms.map((a) => a[0]).join(", ")}</p>}
        </section>
      )}

      {stats.pefPoints.length > 1 && (
        <section className="card">
          <h2 className="section-h">Peak flow (PEF)</h2>
          <Sparkline points={stats.pefPoints} />
          <div className="spark-meta"><span>Low {Math.min(...stats.pefPoints.map((p) => p.pef))}</span><span>Latest {stats.pefPoints[stats.pefPoints.length - 1].pef}</span><span>High {Math.max(...stats.pefPoints.map((p) => p.pef))}</span></div>
        </section>
      )}

      <div className="report-actions">
        <button className="primary" onClick={share}><Ico n="share" s={17} /> Share</button>
        <button className="ghost" onClick={copy}><Ico n="copy" s={16} /> {copied ? "Copied" : "Copy text"}</button>
      </div>

      <section className="card report-preview"><h2 className="section-h">Report preview</h2><pre className="report-text">{text}</pre></section>

      <section className="card">
        <h2 className="section-h">Backup</h2>
        <div className="backup-row">
          <button className="ghost" onClick={exportBackup}><Ico n="download" s={16} /> Export</button>
          <button className="ghost" onClick={() => fileRef.current && fileRef.current.click()}><Ico n="upload" s={16} /> Restore</button>
        </div>
        <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={onFile} />
        <p className="backup-note">Export saves a file with every dose and episode — keep it somewhere safe, or use it to move records to another phone. Restore replaces everything currently in the app.</p>
      </section>
    </div>
  );
}

function Stat({ value, label, big }) {
  return <div className={`stat ${big ? "stat-big" : ""}`}><span className="stat-val">{value}</span><span className="stat-lab">{label}</span></div>;
}

function Sparkline({ points }) {
  const vals = points.map((p) => p.pef);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 320, H = 96, padX = 10, padY = 12;
  const step = points.length > 1 ? (W - 2 * padX) / (points.length - 1) : 0;
  const pts = points.map((p, i) => [padX + i * step, H - padY - ((p.pef - min) / span) * (H - 2 * padY)]);
  const d = pts.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="spark" preserveAspectRatio="none">
      <path d={d} fill="none" stroke="#1C7C88" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {pts.map((c, i) => <circle key={i} cx={c[0]} cy={c[1]} r="3.5" fill="#1C7C88" />)}
    </svg>
  );
}

function computeStats(data, range) {
  const now = new Date(); let start = null;
  if (range > 0) { start = new Date(now); start.setDate(now.getDate() - (range - 1)); start.setHours(0, 0, 0, 0); }
  let given = 0, expectedDays = 0;
  const dayKeys = Object.keys(data.doseLog);
  if (range > 0) expectedDays = range;
  else {
    const allDates = [...dayKeys, ...data.episodes.map((e) => keyOf(new Date(e.at)))].sort();
    if (allDates.length) { const first = new Date(allDates[0] + "T00:00:00"); expectedDays = Math.floor((now - first) / 86400000) + 1; }
    else expectedDays = 1;
  }
  for (const k of dayKeys) {
    const d = new Date(k + "T00:00:00");
    if (start && d < start) continue; if (d > now) continue;
    const log = data.doseLog[k]; given += DOSES.filter((x) => log[x.id] && log[x.id].taken).length;
  }
  const expected = Math.max(expectedDays * DOSES.length, given);
  const missed = Math.max(expected - given, 0);
  const adherence = expected ? Math.round((given / expected) * 100) : 0;
  const episodes = data.episodes.filter((e) => !start || new Date(e.at) >= start).sort((a, b) => new Date(a.at) - new Date(b.at));
  const sevCount = {}, actCount = {}, symCount = {}; let relieverTotal = 0; const pefPoints = [];
  for (const e of episodes) {
    sevCount[e.severity] = (sevCount[e.severity] || 0) + 1;
    (e.activities || []).forEach((a) => { actCount[a] = (actCount[a] || 0) + 1; });
    (e.symptoms || []).forEach((s) => { symCount[s] = (symCount[s] || 0) + 1; });
    relieverTotal += Number(e.reliever || 0);
    if (e.pef) { const d = new Date(e.at); pefPoints.push({ label: `${d.getDate()}/${d.getMonth() + 1}`, pef: Number(e.pef) }); }
  }
  const top = (obj, n) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n);
  return { given, expected, missed, adherence, episodes, sevCount, relieverTotal, topActivities: top(actCount, 3), topSymptoms: top(symCount, 4), pefPoints, start, now };
}

function buildReport(s, range) {
  const fmt = (d) => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const header = range === 0 ? `${CHILD} — Asthma summary (all records to ${fmt(s.now)})` : `${CHILD} — Asthma summary (${fmt(s.start)} – ${fmt(s.now)})`;
  const lines = [header, "", "PREVENTER — Foracort, 2 puffs morning & evening", `  Adherence: ${s.adherence}%  (${s.given} of ${s.expected} doses)`, `  Doses missed: ${s.missed}`, "", `EPISODES: ${s.episodes.length}`];
  if (s.episodes.length) {
    lines.push(`  Severity — ${SEVERITIES.map((x) => `${x.label} ${s.sevCount[x.id] || 0}`).join(", ")}`);
    lines.push(`  Reliever (Levolin) puffs used: ${s.relieverTotal}`);
    if (s.topActivities.length) lines.push(`  At onset: ${s.topActivities.map((a) => `${a[0]} (${a[1]})`).join(", ")}`);
    if (s.topSymptoms.length) lines.push(`  Common symptoms: ${s.topSymptoms.map((a) => a[0]).join(", ")}`);
    if (s.pefPoints.length) { const v = s.pefPoints.map((p) => p.pef); lines.push(`  Peak flow: ${Math.min(...v)}–${Math.max(...v)} (latest ${v[v.length - 1]})`); }
    lines.push("", "DETAIL");
    for (const e of s.episodes) {
      const d = new Date(e.at); const sev = (SEVERITIES.find((x) => x.id === e.severity) || {}).label;
      let line = `  ${d.getDate()} ${MONTHS[d.getMonth()]} ${prettyTime(e.at)} — ${sev}`;
      if (e.activities && e.activities.length) line += `; doing: ${e.activities.join(", ")}`;
      if (e.place) line += `; at: ${e.place}`; else if (e.geo) line += `; at: ${e.geo.lat},${e.geo.lng}`;
      if (e.symptoms && e.symptoms.length) line += `; ${e.symptoms.join(", ")}`;
      if (e.reliever) line += `; Levolin ${e.reliever} puff(s)`;
      if (e.pef) line += `; PEF ${e.pef}`;
      if (e.notes) line += `; note: ${e.notes}`;
      lines.push(line);
    }
  }
  lines.push("", "Logged with a home tracker — not a clinical record.");
  return lines.join("\n");
}

/* ---------- Episode sheet ---------- */
function EpisodeSheet({ existing, onClose, onSave, onDelete }) {
  const [at, setAt] = useState(existing ? isoLocalInput(new Date(existing.at)) : isoLocalInput(new Date()));
  const [severity, setSeverity] = useState((existing && existing.severity) || "mild");
  const [symptoms, setSymptoms] = useState((existing && existing.symptoms) || []);
  const [activities, setActivities] = useState((existing && existing.activities) || []);
  const [reliever, setReliever] = useState((existing && existing.reliever) || 0);
  const [pef, setPef] = useState((existing && existing.pef) || "");
  const [notes, setNotes] = useState((existing && existing.notes) || "");
  const [place, setPlace] = useState((existing && existing.place) || "");
  const [geo, setGeo] = useState((existing && existing.geo) || null);
  const [geoStatus, setGeoStatus] = useState("");

  const toggle = (list, set, v) => set(list.includes(v) ? list.filter((x) => x !== v) : [...list, v]);

  function tagLocation() {
    if (!navigator.geolocation) { setGeoStatus("Location isn't available here — type the place instead."); return; }
    setGeoStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => { setGeo({ lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy) }); setGeoStatus(""); },
      (err) => { setGeoStatus(err.code === 1 ? "Location permission was denied — type the place instead." : "Couldn't get a fix — type the place instead."); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }
  function save() {
    onSave({ id: existing && existing.id, at: new Date(at).toISOString(), severity, symptoms, activities, reliever: Number(reliever) || 0, pef: pef === "" ? null : Number(pef), notes: notes.trim(), place: place.trim(), geo });
  }

  return (
    <div className="sheet-scrim">
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <button className="cancel-btn" onClick={onClose}>Cancel</button>
          <h2>{existing ? "Edit episode" : "Log episode"}</h2>
          <button className="text-btn" onClick={save}>Save</button>
        </div>
        <div className="sheet-body">
          <Field label="When"><input className="dt-input" type="datetime-local" value={at} onChange={(e) => setAt(e.target.value)} /></Field>
          <Field label="Where">
            <input className="dt-input" type="text" placeholder="e.g. School playground" value={place} onChange={(e) => setPlace(e.target.value)} />
            <button type="button" className="geo-btn" onClick={tagLocation}><Ico n="pin" s={15} />{geoStatus === "locating" ? "Locating…" : geo ? "Update GPS pin" : "Tag current location"}</button>
            {geo && (
              <div className="geo-chip">
                <span><Ico n="pin" s={13} /> {geo.lat}, {geo.lng}<span className="geo-acc"> ±{geo.acc}m</span></span>
                <span className="geo-links">
                  <a href={`https://www.google.com/maps?q=${geo.lat},${geo.lng}`} target="_blank" rel="noreferrer">Map</a>
                  <button type="button" onClick={() => { setGeo(null); setGeoStatus(""); }}>Clear</button>
                </span>
              </div>
            )}
            {geoStatus && geoStatus !== "locating" && <p className="geo-note">{geoStatus}</p>}
          </Field>
          <Field label="Severity">
            <div className="chips">
              {SEVERITIES.map((s) => (
                <button key={s.id} className={`chip sev-chip ${severity === s.id ? "on" : ""}`} style={severity === s.id ? { background: s.color, borderColor: s.color, color: "#fff" } : {}} onClick={() => setSeverity(s.id)}>
                  <span className="sev-dot" style={{ background: s.color }} />{s.label}
                </button>
              ))}
            </div>
          </Field>
          <Field label="What was she doing?"><div className="chips">{ACTIVITIES.map((a) => <button key={a} className={`chip ${activities.includes(a) ? "on" : ""}`} onClick={() => toggle(activities, setActivities, a)}>{a}</button>)}</div></Field>
          <Field label="Symptoms"><div className="chips">{SYMPTOMS.map((s) => <button key={s} className={`chip ${symptoms.includes(s) ? "on" : ""}`} onClick={() => toggle(symptoms, setSymptoms, s)}>{s}</button>)}</div></Field>
          <Field label="Reliever — Levolin puffs"><div className="stepper"><button onClick={() => setReliever(Math.max(0, reliever - 1))}>−</button><span>{reliever}</span><button onClick={() => setReliever(reliever + 1)}>+</button></div></Field>
          <Field label="Peak flow (PEF) — optional"><input className="num-input" type="number" inputMode="numeric" placeholder="e.g. 220" value={pef} onChange={(e) => setPef(e.target.value)} /></Field>
          <Field label="Notes — optional"><textarea className="notes-input" rows={3} placeholder="Anything else worth remembering" value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
          {existing && <button className="delete-btn" onClick={() => onDelete(existing.id)}><Ico n="trash" s={16} /> Delete this episode</button>}
        </div>
      </div>
    </div>
  );
}

function Field({ label, children }) { return <div className="field"><label className="field-label">{label}</label>{children}</div>; }
function Disclaimer() {
  return <p className="disclaimer"><Ico n="alert" s={13} /> A home logging aid for you and {CHILD}'s doctor — not medical advice. In an emergency, follow her asthma action plan or seek urgent care.</p>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
