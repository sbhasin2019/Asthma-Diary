<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Zoya — Asthma</title>
<meta name="theme-color" content="#1F6159" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Zoya Asthma" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link id="mani" rel="manifest" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#EDF1E4; --surface:#FFFFFF; --ink:#22301F; --muted:#68705C; --faint:#9AA48C;
  --line:#DCE2CC; --teal:#1F6159; --teal-deep:#174A43; --teal-soft:#DFEBE7;
  --green:#3E6B3A; --mild:#3E6B3A; --moderate:#D79A2B; --severe:#B73250; --sky:#5C8A82;
  --shadow:0 1px 3px rgba(34,48,31,.08), 0 4px 14px rgba(34,48,31,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;background:var(--bg);}
#root{min-height:100%;}
body, body *{font-family:'Karla',system-ui,-apple-system,sans-serif;}
.app{background:var(--bg);min-height:100%;display:flex;justify-content:center;color:var(--ink);}
.phone{width:100%;max-width:440px;min-height:100vh;position:relative;display:flex;flex-direction:column;}

.screen{flex:1;padding:max(26px,env(safe-area-inset-top)) 20px 96px;display:flex;flex-direction:column;gap:18px;animation:fade .35s ease;}
.loading{align-items:center;justify-content:center;gap:12px;color:var(--muted);height:100vh;}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.head{margin-top:4px;}
.eyebrow{font-size:12.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--teal);font-weight:600;margin:0 0 3px;}
.title{font-family:'Young Serif',serif;font-weight:500;font-size:32px;line-height:1.04;margin:0;letter-spacing:-.01em;}

.ring-area{display:flex;justify-content:center;padding:6px 0 2px;}
.ring-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;}
.ring-wrap.pulsing{animation:breathe 4.5s ease-in-out infinite;}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@media (prefers-reduced-motion: reduce){.ring-wrap.pulsing{animation:none}}
.ring{width:200px;height:200px;}
.ring-track{fill:none;stroke:var(--line);stroke-width:13;}
.ring-prog{fill:none;stroke:var(--teal);stroke-width:13;stroke-linecap:round;transition:stroke-dasharray .7s cubic-bezier(.4,0,.2,1);}
.ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;}
.ring-num{font-family:'Young Serif',serif;font-size:54px;font-weight:500;line-height:1;color:var(--ink);}
.ring-den{font-size:26px;color:var(--faint);}
.ring-check{color:var(--green);}
.ring-cap{font-size:12.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em;}

.doses{display:flex;flex-direction:column;gap:10px;}
.dose{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;box-shadow:var(--shadow);width:100%;
  transition:border-color .2s, background .2s;}
.dose-main{flex:1;min-width:0;display:flex;align-items:center;gap:13px;padding:14px 15px;
  background:none;border:none;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:transform .12s ease;}
.dose-main:active{transform:scale(.99);}
.dose-edit{flex-shrink:0;width:54px;border:none;border-left:1px solid var(--line);background:none;
  color:var(--teal-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.dose-edit:active{background:var(--teal-soft);}
.dose-ic{width:38px;height:38px;border-radius:11px;background:var(--teal-soft);color:var(--teal-deep);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.dose-text{display:flex;flex-direction:column;flex:1;min-width:0;}
.dose-label{font-weight:600;font-size:15px;}
.dose-detail{font-size:13px;color:var(--muted);margin-top:1px;}
.dose-check{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.empty-dot{width:21px;height:21px;border-radius:50%;border:2px solid var(--line);}
.dose.done{background:#EAF1E0;border-color:#CFE0C3;}
.dose.done .dose-ic{background:#E4EDDD;color:var(--green);}
.dose.done .dose-check{background:var(--green);color:#fff;}
.dose.done .dose-edit{border-left-color:#CFE0C3;}
.dose.due{border-color:var(--moderate);box-shadow:0 0 0 3px rgba(215,154,43,.12),var(--shadow);}
.dose.due .dose-detail{color:var(--moderate);font-weight:600;}
.all-done{font-size:13.5px;color:var(--green);text-align:center;margin:2px 0 0;font-weight:500;}
.dose-group{display:flex;flex-direction:column;gap:8px;}
.dose-time{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 2px;}
.dose-time-lab{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600;}
.time-in{width:auto !important;min-width:120px;}

.primary{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--teal);color:#fff;
  border:none;border-radius:14px;padding:15px;font-size:15.5px;font-weight:600;cursor:pointer;width:100%;
  box-shadow:0 4px 14px rgba(31,97,89,.28);transition:transform .12s, background .2s;font-family:inherit;}
.primary:active{transform:scale(.98);background:var(--teal-deep);}
.log-btn{margin-top:2px;}
.ghost{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.ghost:active{transform:scale(.98);}

.section-h{font-family:'Young Serif',serif;font-weight:500;font-size:18px;margin:0 0 11px;letter-spacing:-.01em;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);}

.today-eps{display:flex;flex-direction:column;}
.ep-list{display:flex;flex-direction:column;}
.ep-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;text-align:left;width:100%;
  box-shadow:var(--shadow);transition:transform .12s;font:inherit;color:inherit;}
.ep-row:active{transform:scale(.99);}
.ep-sev{width:9px;height:38px;border-radius:5px;flex-shrink:0;}
.ep-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.ep-top{display:flex;align-items:baseline;gap:8px;}
.ep-sev-label{font-weight:600;font-size:14.5px;}
.ep-when{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:3px;flex-wrap:wrap;}
.ep-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ep-edit{color:var(--faint);flex-shrink:0;}
.ep-pin{vertical-align:-1px;color:var(--teal);}
.empty{font-size:14px;color:var(--muted);padding:6px 2px;}

.strip{display:flex;justify-content:space-between;gap:3px;}
.strip-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;background:none;border:none;
  cursor:pointer;padding:5px 0;font:inherit;color:inherit;border-radius:8px;transition:background .15s;}
.strip-col:active{background:var(--teal-soft);}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.mini-btn{display:flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal-deep);border:none;
  border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.mini-btn:active{transform:scale(.96);}
.strip-key{font-size:11.5px;color:var(--faint);margin:11px 0 0;text-align:center;line-height:1.4;}

.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-title{font-family:'Young Serif',serif;font-size:18px;font-weight:500;color:var(--ink);}
.cal-nav{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  color:var(--teal-deep);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.cal-nav:disabled{color:var(--faint);opacity:.4;cursor:default;}
.cal-nav:active:not(:disabled){background:var(--teal-soft);}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;}
.cal-wd span{text-align:center;font-size:11px;font-weight:600;color:var(--faint);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:3px;padding:6px 0 6px;min-height:46px;background:var(--bg);border:1.5px solid transparent;border-radius:10px;
  cursor:pointer;font-family:inherit;color:inherit;}
.cal-cell:active:not(:disabled){background:var(--teal-soft);}
.cal-cell.empty{background:transparent;border:none;cursor:default;}
.cal-cell.today{border-color:var(--teal);}
.cal-cell.isfuture{opacity:.4;cursor:default;}
.cal-num{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1;}
.cal-num.lev{color:var(--severe);}
.cal-bar{width:18px;height:4px;border-radius:2px;background:transparent;}
.cal-bar.both{background:var(--green);}
.cal-bar.one{background:var(--moderate);}
.cal-bar.none{background:var(--severe);}
.cal-dot{width:4px;height:4px;border-radius:50%;background:transparent;}
.cal-dot.on{background:var(--teal);}
.cal-rx{position:absolute;top:3px;right:3px;color:var(--teal-deep);display:flex;}
.leg-rx{color:var(--teal-deep);display:inline-flex;}
.dosebar{width:100%;max-width:20px;height:9px;border-radius:3px;background:var(--line);}
.dosebar.both{background:var(--green);}
.dosebar.one{background:var(--moderate);}
.dosebar.none{background:var(--severe);}
.dosebar.pre{background:var(--line);opacity:.45;}
.strip-day{font-size:10.5px;color:var(--faint);}
.strip-day.lev{color:var(--severe);font-weight:700;}
.ep-dot{width:5px;height:5px;border-radius:50%;background:transparent;}
.ep-dot.on{background:var(--teal);}

.legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
.leg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.leg-bar{width:16px;height:8px;border-radius:3px;display:inline-block;}
.leg-bar.both{background:var(--green);}
.leg-bar.one{background:var(--moderate);}
.leg-bar.none{background:var(--severe);}
.leg-date{font-size:12px;font-weight:700;color:var(--severe);}
.leg-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);display:inline-block;}

.geo-btn{display:flex;align-items:center;gap:7px;align-self:flex-start;background:var(--teal-soft);
  color:var(--teal-deep);border:none;border-radius:11px;padding:9px 13px;font-size:13px;font-weight:600;
  cursor:pointer;margin-top:2px;font-family:inherit;}
.geo-btn:active{transform:scale(.97);}
.geo-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:12.5px;color:var(--ink);margin-top:2px;}
.geo-chip > span:first-child{display:flex;align-items:center;gap:5px;}
.geo-acc{color:var(--faint);}
.geo-links{display:flex;gap:12px;flex-shrink:0;}
.geo-links a,.geo-links button{font-size:12.5px;font-weight:600;color:var(--teal);background:none;
  border:none;cursor:pointer;text-decoration:none;padding:0;font-family:inherit;}
.geo-note{font-size:12px;color:var(--moderate);margin:2px 0 0;line-height:1.45;}

.range-row{display:flex;gap:8px;}
.range-chip{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 0;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;}
.range-chip.sel{background:var(--ink);border-color:var(--ink);color:#fff;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;}
.stat{display:flex;flex-direction:column;gap:3px;}
.stat-big{grid-column:1 / -1;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:1px;}
.stat-val{font-family:'Young Serif',serif;font-weight:600;font-size:25px;line-height:1;color:var(--teal-deep);}
.stat-big .stat-val{font-size:40px;color:var(--teal);}
.stat-lab{font-size:12.5px;color:var(--muted);}

.sev-bars{display:flex;flex-direction:column;gap:9px;}
.sev-line{display:flex;align-items:center;gap:10px;}
.sev-name{font-size:13px;width:74px;color:var(--ink);}
.sev-track{flex:1;height:9px;background:var(--bg);border-radius:6px;overflow:hidden;}
.sev-fill{display:block;height:100%;border-radius:6px;transition:width .5s;}
.sev-n{font-size:13px;font-weight:600;width:18px;text-align:right;color:var(--muted);}
.meta-line{font-size:13px;color:var(--muted);margin:11px 0 0;line-height:1.5;}
.meta-line strong{color:var(--ink);font-weight:600;}

.spark{width:100%;height:96px;display:block;}
.spark-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;}
.pef-form{display:flex;gap:12px;margin-bottom:14px;}
.pef-field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;}
.pef-field .num-input,.pef-field .dt-input{width:100%;}
.pef-chart{width:100%;height:auto;display:block;}
.pef-unit{font-size:12px;color:var(--muted);font-weight:500;}
.pef-best{color:var(--moderate);font-weight:600;}
.pb-row{display:flex;align-items:center;gap:10px;}
.pb-row .num-input{width:150px;}
.pb-unit{font-size:13px;color:var(--muted);}
.zone-legend{display:flex;flex-wrap:wrap;gap:9px 16px;margin-top:13px;}
.zl{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);}
.zl-dot{width:10px;height:10px;border-radius:50%;}

.report-actions{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;}
.report-preview{background:#F7FAF0;}
.report-text{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.6;
  color:var(--ink);white-space:pre-wrap;word-break:break-word;margin:0;}

.backup-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.backup-note{font-size:12px;color:var(--faint);line-height:1.5;margin:11px 0 0;}

.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:440px;margin:0 auto;height:74px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  background:none;border:none;color:var(--faint);font-size:11px;font-weight:600;cursor:pointer;padding-top:11px;font-family:inherit;}
.tab.on{color:var(--teal);}

.sheet-scrim{position:fixed;inset:0;background:rgba(34,48,31,.34);display:flex;align-items:flex-end;
  justify-content:center;z-index:50;animation:fade .2s ease;}
.sheet{width:100%;max-width:440px;max-height:92vh;background:var(--bg);border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;animation:rise .28s cubic-bezier(.4,0,.2,1);overflow:hidden;}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;
  border-bottom:1px solid var(--line);background:var(--surface);}
.sheet-head h2{font-family:'Young Serif',serif;font-weight:500;font-size:18px;margin:0;}
.cancel-btn{background:none;border:none;color:var(--muted);font-size:14.5px;font-weight:500;cursor:pointer;padding:8px 4px;font-family:inherit;}
.text-btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:8px 18px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.sheet-body{overflow-y:auto;padding:18px 18px 30px;display:flex;flex-direction:column;gap:19px;}

.field{display:flex;flex-direction:column;gap:9px;}
.field-label{font-size:13.5px;font-weight:600;color:var(--ink);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 13px;
  font-size:13.5px;color:var(--ink);cursor:pointer;font-weight:500;transition:all .15s;font-family:inherit;}
.chip:active{transform:scale(.96);}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}
.sev-chip{display:flex;align-items:center;gap:7px;}
.sev-dot{width:9px;height:9px;border-radius:50%;}
.sev-chip.on .sev-dot{background:#fff !important;}

.stepper{display:flex;align-items:center;gap:0;width:fit-content;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);}
.stepper button{width:48px;height:46px;border:none;background:var(--surface);font-size:22px;color:var(--teal);cursor:pointer;font-weight:500;font-family:inherit;}
.stepper button:active{background:var(--teal-soft);}
.stepper span{width:54px;text-align:center;font-size:18px;font-weight:600;border-left:1px solid var(--line);border-right:1px solid var(--line);height:46px;line-height:46px;}

.dt-input,.num-input,.notes-input{font-family:'Karla',sans-serif;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 13px;font-size:15px;color:var(--ink);width:100%;}
.num-input{width:140px;}
.notes-input{resize:none;line-height:1.5;}
.dt-input:focus,.num-input:focus,.notes-input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}

.delete-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:1px solid #E6C5CC;color:var(--severe);border-radius:12px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;font-family:inherit;}
.delete-btn:active{background:#F6E3E7;}

.disclaimer{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;color:var(--faint);line-height:1.5;margin:8px 2px 0;}
.disclaimer svg{flex-shrink:0;margin-top:2px;}

.head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.bell-btn{position:relative;flex-shrink:0;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--teal-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:6px;box-shadow:var(--shadow);}
.bell-btn:active{transform:scale(.96);}
.bell-on{position:absolute;top:8px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--surface);}
.rem-rows{display:flex;flex-direction:column;gap:9px;}
.rem-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:13px 14px;font-size:13.5px;}
.rem-row > span:first-child{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);}
.rem-row > span:last-child{color:var(--muted);font-size:12.5px;text-align:right;}
.rem-status{font-size:12.5px;color:var(--muted);line-height:1.5;margin:4px 0 0;}
.primary:disabled{opacity:.6;}

.dose-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
  cursor:pointer;box-shadow:var(--shadow);font-family:inherit;margin-top:-2px;}
.dose-banner:active{transform:scale(.99);}
.db-left{display:flex;align-items:center;gap:11px;min-width:0;}
.db-ic{width:34px;height:34px;border-radius:10px;background:var(--teal-soft);color:var(--teal-deep);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.db-text{display:flex;flex-direction:column;min-width:0;}
.db-cur{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;}
.db-val{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.db-link{font-size:13px;font-weight:600;color:var(--teal);flex-shrink:0;}

.cur-dose{display:flex;flex-direction:column;gap:3px;background:var(--teal-soft);border-radius:15px;padding:16px;}
.cur-dose-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);font-weight:700;}
.cur-dose-val{font-family:'Young Serif',serif;font-size:23px;font-weight:500;color:var(--ink);line-height:1.1;}
.cur-dose-since{font-size:12.5px;color:var(--teal-deep);}
.change-form{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:15px;}
.change-form-head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:var(--ink);}
.puff-row{display:flex;gap:14px;}
.puff-col{display:flex;flex-direction:column;gap:9px;flex:1;}
.puff-col .field-label{display:flex;align-items:center;gap:6px;}
.reg-list{display:flex;flex-direction:column;gap:9px;}
.reg-row{display:flex;align-items:stretch;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;}
.reg-row.editing{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}
.reg-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;background:none;border:none;
  text-align:left;padding:13px 14px;cursor:pointer;font-family:inherit;color:inherit;}
.reg-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink);}
.reg-current{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  background:var(--teal-soft);color:var(--teal-deep);border-radius:6px;padding:2px 7px;}
.reg-when{font-size:12.5px;color:var(--muted);}
.reg-del{flex-shrink:0;width:46px;border:none;border-left:1px solid var(--line);background:var(--surface);
  color:var(--severe);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.reg-del:disabled{color:var(--faint);opacity:.4;cursor:default;}
.reg-del:active:not(:disabled){background:#F6E3E7;}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:80;display:flex;align-items:center;gap:8px;
  max-width:380px;width:calc(100% - 40px);background:var(--ink);color:#fff;border-radius:13px;padding:12px 15px;
  font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(34,48,31,.25);animation:toastIn .25s ease;}
.toast svg{flex-shrink:0;color:#A9CBA0;}
.toast.warn{background:var(--severe);}
.toast.warn svg{color:#fff;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ---------- config ---------- */
const CHILD = "Zoya";
const STORE_KEY = "asthma_zoya_v1";
const DOSES = [
  { id: "morning", label: "Morning", med: "Foracort", detail: "2 puffs", icon: "sun", dueHour: 7 },
  { id: "evening", label: "Evening", med: "Foracort", detail: "2 puffs", icon: "moon", dueHour: 20 },
];
const SEVERITIES = [
  { id: "mild", label: "Mild", color: "var(--mild)" },
  { id: "moderate", label: "Moderate", color: "var(--moderate)" },
  { id: "severe", label: "Severe", color: "var(--severe)" },
];
const SYMPTOMS = ["Cough", "Wheeze", "Breathlessness", "Chest tightness", "Night waking", "Hard to speak", "Fast breathing"];
const ACTIVITIES = ["Running / sport", "PE or games", "Outdoor play", "Climbing stairs", "Laughing / excited", "Cold air", "Dust", "Pollen", "Around pets", "Cold or illness", "Smoke / strong smell", "At rest"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

/* ---------- storage ---------- */
function normalize(d) {
  if (!d || typeof d !== "object") d = {};
  if (!d.doseLog) d.doseLog = {};
  if (!Array.isArray(d.episodes)) d.episodes = [];
  if (!Array.isArray(d.pefReadings)) d.pefReadings = [];
  if (typeof d.pefBest === "undefined") d.pefBest = null;
  if (!Array.isArray(d.regimen) || d.regimen.length === 0) {
    const keys = [...Object.keys(d.doseLog), ...d.episodes.map((e) => keyOf(new Date(e.at)))].sort();
    const from = keys.length ? keys[0] : todayKey();
    d.regimen = [{ id: "r_seed", from, morning: 2, evening: 2 }];
  }
  return d;
}
function loadData() {
  try { const r = localStorage.getItem(STORE_KEY); if (r) return normalize(JSON.parse(r)); } catch (e) {}
  return normalize({ doseLog: {}, episodes: [] });
}
function saveData(d) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(d)); return true; }
  catch (e) { console.error(e); return false; }
}
const clone = (o) => (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o)));

/* ---------- regimen (dosage over time) ---------- */
const puffLabel = (n) => `${n} puff${Number(n) === 1 ? "" : "s"}`;
function regimenSorted(regimen) { return [...(regimen || [])].sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0)); }
function regimenOn(regimen, dateKey) {
  const s = regimenSorted(regimen);
  if (!s.length) return { morning: 2, evening: 2 };
  let cur = s[0];
  for (const r of s) { if (r.from <= dateKey) cur = r; else break; }
  return cur;
}
const currentRegimen = (regimen) => regimenOn(regimen, todayKey());
function regimenText(r) {
  return r.morning === r.evening
    ? `${puffLabel(r.morning)} morning & evening`
    : `${puffLabel(r.morning)} morning / ${puffLabel(r.evening)} evening`;
}

/* ---------- reminders (on-device scheduled notifications) ---------- */
const REM_KEY = "asthma_zoya_reminders";
// JS getDay(): Sun=0, Mon=1 ... Sat=6
const REM_RULES = [
  { id: "am_wd", label: "Morning Foracort — 2 puffs", hour: 7, min: 0, days: [1, 2, 3, 4, 5] },
  { id: "am_we", label: "Morning Foracort — 2 puffs", hour: 9, min: 0, days: [0, 6] },
  { id: "pm", label: "Evening Foracort — 2 puffs", hour: 20, min: 0, days: [0, 1, 2, 3, 4, 5, 6] },
];
const triggersSupported = () => typeof window !== "undefined" && "Notification" in window && "TimestampTrigger" in window;

async function clearReminders() {
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) return;
    const ns = await reg.getNotifications({ includeTriggered: true });
    ns.forEach((n) => { if (n.tag && n.tag.indexOf("zdose-") === 0) n.close(); });
  } catch (e) {}
}
async function scheduleReminders() {
  if (!triggersSupported() || Notification.permission !== "granted") return false;
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) return false;
  await clearReminders();
  const cur = currentRegimen(loadData().regimen);
  const now = Date.now();
  for (let off = 0; off < 14; off++) {
    const d = new Date(); d.setDate(d.getDate() + off);
    const dow = d.getDay();
    for (const r of REM_RULES) {
      if (!r.days.includes(dow)) continue;
      const t = new Date(d); t.setHours(r.hour, r.min, 0, 0);
      const ts = t.getTime();
      if (ts <= now + 2000) continue;
      const slot = r.id === "pm" ? "Evening" : "Morning";
      const puffs = r.id === "pm" ? cur.evening : cur.morning;
      try {
        await reg.showNotification("Zoya — asthma", {
          tag: `zdose-${keyOf(t)}-${r.id}`, body: `${slot} Foracort — ${puffLabel(puffs)}`, requireInteraction: false,
          showTrigger: new TimestampTrigger(ts), data: { url: location.href },
        });
      } catch (e) {}
    }
  }
  return true;
}
async function enableReminders() {
  if (!("Notification" in window)) return { ok: false, reason: "unsupported" };
  let perm = Notification.permission;
  if (perm !== "granted") perm = await Notification.requestPermission();
  if (perm !== "granted") return { ok: false, reason: "denied" };
  if (!triggersSupported()) return { ok: false, reason: "notriggers" };
  const ok = await scheduleReminders();
  return { ok, reason: ok ? "" : "failed" };
}
async function testNotification() {
  if (!("Notification" in window)) return false;
  let perm = Notification.permission;
  if (perm !== "granted") perm = await Notification.requestPermission();
  if (perm !== "granted") return false;
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) return false;
  const opts = { tag: "ztest", body: "Test reminder — this is how a dose alert will look.", data: { url: location.href } };
  if (triggersSupported()) opts.showTrigger = new TimestampTrigger(Date.now() + 5000);
  try { await reg.showNotification("Zoya — asthma", opts); return true; } catch (e) { return false; }
}

/* ---------- date helpers ---------- */
const pad = (n) => String(n).padStart(2, "0");
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const prettyDate = (d) => `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
function prettyTime(iso) {
  const d = new Date(iso); let h = d.getHours(); const m = pad(d.getMinutes());
  const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return `${h}:${m} ${ap}`;
}
const isoLocalInput = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* ---------- icons ---------- */
function Ico({ n, s = 20 }) {
  const p = { width: s, height: s, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" };
  switch (n) {
    case "check": return <svg {...p}><path d="M20 6 9 17l-5-5" /></svg>;
    case "plus": return <svg {...p}><path d="M12 5v14M5 12h14" /></svg>;
    case "wind": return <svg {...p}><path d="M3 8h10a3 3 0 1 0-3-3" /><path d="M3 12h15a3 3 0 1 1-3 3" /><path d="M3 16h8a2.5 2.5 0 1 1-2.5 2.5" /></svg>;
    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>;
    case "moon": return <svg {...p}><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" /></svg>;
    case "alert": return <svg {...p}><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" /><path d="M12 9v4M12 17h.01" /></svg>;
    case "pencil": return <svg {...p}><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z" /></svg>;
    case "pin": return <svg {...p}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z" /><circle cx="12" cy="10" r="3" /></svg>;
    case "trash": return <svg {...p}><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" /></svg>;
    case "copy": return <svg {...p}><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg>;
    case "share": return <svg {...p}><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13" /></svg>;
    case "clock": return <svg {...p}><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>;
    case "doc": return <svg {...p}><path d="M6 3h8l4 4v14H6z" /><path d="M14 3v4h4M9 13h6M9 17h6" /></svg>;
    case "download": return <svg {...p}><path d="M12 3v12M7 10l5 5 5-5M5 21h14" /></svg>;
    case "upload": return <svg {...p}><path d="M12 21V9M7 14l5-5 5 5M5 3h14" /></svg>;
    case "bell": return <svg {...p}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.7 21a2 2 0 0 1-3.4 0" /></svg>;
    case "pill": return <svg {...p}><path d="M10.5 20.5 21 10a4.95 4.95 0 1 0-7-7L3.5 13.5a4.95 4.95 0 1 0 7 7Z" /><path d="m8.5 8.5 7 7" /></svg>;
    case "pulse": return <svg {...p}><path d="M3 12h4l2.5 7 5-14 2.5 7H21" /></svg>;
    default: return null;
  }
}

/* ================= App ================= */
function App() {
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("today");
  const [sheet, setSheet] = useState(null);
  const [now, setNow] = useState(new Date());
  const [toast, setToast] = useState(null);
  const [remOpen, setRemOpen] = useState(false);
  const [dayEdit, setDayEdit] = useState(null); // null | dateKey
  const [doseOpen, setDoseOpen] = useState(false);
  const [remEnabled, setRemEnabled] = useState(() => { try { return localStorage.getItem(REM_KEY) === "1"; } catch (e) { return false; } });

  const showToast = useCallback((msg, warn = false) => {
    setToast({ msg, warn });
    setTimeout(() => setToast(null), warn ? 5000 : 1800);
  }, []);

  useEffect(() => { setData(loadData()); }, []);
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 60000); return () => clearInterval(t); }, []);
  useEffect(() => {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => { if (remEnabled) scheduleReminders(); })
        .catch(() => {});
    }
  }, []);
  useEffect(() => {
    const refresh = () => { if (!document.hidden) { setNow(new Date()); setData(loadData()); } };
    document.addEventListener("visibilitychange", refresh);
    window.addEventListener("focus", refresh);
    return () => { document.removeEventListener("visibilitychange", refresh); window.removeEventListener("focus", refresh); };
  }, []);
  useEffect(() => {
    try {
      if (navigator.storage && navigator.storage.persist && navigator.storage.persisted) {
        navigator.storage.persisted().then((p) => { if (!p) navigator.storage.persist(); }).catch(() => {});
      }
    } catch (e) {}
  }, []);

  const update = useCallback((mutator, okMsg) => {
    setData((prev) => {
      const next = mutator(clone(prev));
      const ok = saveData(next);
      if (!ok) showToast("Couldn't save to this device — if you're in a private/incognito tab, open the normal link instead.", true);
      else if (okMsg) showToast(okMsg);
      return next;
    });
  }, [showToast]);

  if (!data) return <div className="app"><div className="screen loading"><Ico n="wind" s={28} /><span>Loading…</span></div></div>;

  const tk = todayKey();
  const todayLog = data.doseLog[tk] || {};
  const todayEpisodes = data.episodes.filter((e) => keyOf(new Date(e.at)) === tk).sort((a, b) => new Date(b.at) - new Date(a.at));

  function toggleDose(id) {
    const key = todayKey();
    const dose = DOSES.find((x) => x.id === id);
    const wasTaken = !!(data.doseLog[key] && data.doseLog[key][id] && data.doseLog[key][id].taken);
    update((d) => {
      const day = d.doseLog[key] || {};
      if (day[id] && day[id].taken) delete day[id];
      else day[id] = { taken: true, at: new Date().toISOString() };
      d.doseLog[key] = day; return d;
    }, wasTaken ? `${dose.label} dose cleared` : `${dose.label} dose saved`);
  }
  function saveEpisode(ep) {
    update((d) => {
      if (ep.id) d.episodes = d.episodes.map((e) => (e.id === ep.id ? ep : e));
      else d.episodes.push({ ...ep, id: "e_" + Date.now() });
      return d;
    }, ep.id ? "Episode updated" : "Episode saved");
    setSheet(null);
  }
  function deleteEpisode(id) {
    update((d) => { d.episodes = d.episodes.filter((e) => e.id !== id); return d; }, "Episode deleted");
    setSheet(null);
  }
  function restoreBackup(obj) {
    if (!obj || typeof obj !== "object" || !("doseLog" in obj) || !("episodes" in obj)) {
      showToast("That file isn't a valid backup", true); return;
    }
    setData(obj); saveData(obj); showToast("Backup restored");
  }
  function setDay(dateKey, vals) {
    update((d) => {
      const day = { ...(d.doseLog[dateKey] || {}) };
      DOSES.forEach((dose) => {
        const v = vals[dose.id];
        if (v && v.taken) {
          const parts = (v.time || (pad(dose.dueHour) + ":00")).split(":");
          const h = Number(parts[0]) || 0, m = Number(parts[1]) || 0;
          const dt = new Date(dateKey + "T00:00:00"); dt.setHours(h, m, 0, 0);
          day[dose.id] = { taken: true, at: dt.toISOString() };
        } else {
          delete day[dose.id];
        }
      });
      if (Object.keys(day).length) d.doseLog[dateKey] = day; else delete d.doseLog[dateKey];
      return d;
    }, "Day updated");
    setDayEdit(null);
  }
  function saveRegimen(entry) {
    update((d) => {
      const e = { ...entry, morning: Number(entry.morning), evening: Number(entry.evening) };
      if (e.id && d.regimen.some((r) => r.id === e.id)) d.regimen = d.regimen.map((r) => (r.id === e.id ? e : r));
      else d.regimen.push({ ...e, id: e.id || ("r_" + Date.now()) });
      d.regimen = regimenSorted(d.regimen);
      return d;
    }, "Dosage saved");
    if (remEnabled) setTimeout(() => scheduleReminders(), 50);
  }
  function deleteRegimen(id) {
    update((d) => { if (d.regimen.length > 1) d.regimen = d.regimen.filter((r) => r.id !== id); return d; }, "Dosage entry removed");
  }
  function savePef(reading) {
    update((d) => {
      const r = { ...reading, value: Number(reading.value) };
      if (r.id && d.pefReadings.some((x) => x.id === r.id)) d.pefReadings = d.pefReadings.map((x) => (x.id === r.id ? r : x));
      else d.pefReadings.push({ ...r, id: r.id || ("p_" + Date.now()) });
      d.pefReadings.sort((a, b) => new Date(a.at) - new Date(b.at));
      return d;
    }, "Reading saved");
  }
  function deletePef(id) {
    update((d) => { d.pefReadings = d.pefReadings.filter((x) => x.id !== id); return d; }, "Reading deleted");
  }
  function savePefBest(v) {
    update((d) => { d.pefBest = (v === "" || v == null) ? null : Number(v); return d; }, "Personal best saved");
  }

  return (
    <div className="app">
      <div className="phone">
        {tab === "today" && <Today now={now} todayLog={todayLog} todayEpisodes={todayEpisodes} regimen={data.regimen} onToggle={toggleDose} onLog={() => setSheet({})} onOpenEpisode={(e) => setSheet({ episode: e })} onReminders={() => setRemOpen(true)} onDosage={() => setDoseOpen(true)} onEditDay={(k) => setDayEdit(k)} remEnabled={remEnabled} />}
        {tab === "history" && <History data={data} onOpenEpisode={(e) => setSheet({ episode: e })} onEditDay={(k) => setDayEdit(k)} />}
        {tab === "pef" && <PeakFlow readings={data.pefReadings} pefBest={data.pefBest} onSave={savePef} onDelete={deletePef} onSaveBest={savePefBest} showToast={showToast} />}
        {tab === "summary" && <Summary data={data} onRestore={restoreBackup} showToast={showToast} />}

        <nav className="tabbar">
          <button className={`tab ${tab === "today" ? "on" : ""}`} onClick={() => setTab("today")}><Ico n="wind" s={21} /><span>Today</span></button>
          <button className={`tab ${tab === "history" ? "on" : ""}`} onClick={() => setTab("history")}><Ico n="clock" s={21} /><span>History</span></button>
          <button className={`tab ${tab === "pef" ? "on" : ""}`} onClick={() => setTab("pef")}><Ico n="pulse" s={21} /><span>Peak flow</span></button>
          <button className={`tab ${tab === "summary" ? "on" : ""}`} onClick={() => setTab("summary")}><Ico n="doc" s={21} /><span>Summary</span></button>
        </nav>
      </div>

      {sheet && <EpisodeSheet existing={sheet.episode} onClose={() => setSheet(null)} onSave={saveEpisode} onDelete={deleteEpisode} />}

      {remOpen && <ReminderSheet onClose={() => setRemOpen(false)} showToast={showToast} enabled={remEnabled} setEnabled={setRemEnabled} />}

      {dayEdit && <DayEditor initialKey={dayEdit} doseLog={data.doseLog} regimen={data.regimen} onClose={() => setDayEdit(null)} onSave={setDay} />}

      {doseOpen && <DosageSheet regimen={data.regimen} onClose={() => setDoseOpen(false)} onSave={saveRegimen} onDelete={deleteRegimen} />}

      {toast && <div className={`toast ${toast.warn ? "warn" : ""}`}>{toast.warn ? <Ico n="alert" s={16} /> : <Ico n="check" s={16} />}<span>{toast.msg}</span></div>}
    </div>
  );
}

/* ---------- Today ---------- */
function Today({ now, todayLog, todayEpisodes, regimen, onToggle, onLog, onOpenEpisode, onReminders, onDosage, onEditDay, remEnabled }) {
  const takenCount = DOSES.filter((d) => todayLog[d.id] && todayLog[d.id].taken).length;
  const complete = takenCount === DOSES.length;
  const reg = currentRegimen(regimen);
  return (
    <div className="screen">
      <header className="head head-row">
        <div><p className="eyebrow">{prettyDate(now)}</p><h1 className="title">{CHILD}'s day</h1></div>
        <button className="bell-btn" onClick={onReminders} aria-label="Reminders"><Ico n="bell" s={22} />{remEnabled && <span className="bell-on" />}</button>
      </header>
      <BreathRing taken={takenCount} total={DOSES.length} />
      <div className="doses">
        {DOSES.map((dose) => {
          const rec = todayLog[dose.id]; const taken = !!(rec && rec.taken);
          const due = !taken && now.getHours() >= dose.dueHour;
          const puffs = dose.id === "evening" ? reg.evening : reg.morning;
          return (
            <div key={dose.id} className={`dose ${taken ? "done" : ""} ${due ? "due" : ""}`}>
              <button className="dose-main" onClick={() => onToggle(dose.id)}>
                <span className="dose-ic"><Ico n={dose.icon} /></span>
                <span className="dose-text">
                  <span className="dose-label">{dose.label} · {dose.med}</span>
                  <span className="dose-detail">{taken ? `Taken at ${prettyTime(rec.at)}` : `${puffLabel(puffs)}${due ? " · due now" : ""}`}</span>
                </span>
                <span className="dose-check">{taken ? <Ico n="check" s={18} /> : <span className="empty-dot" />}</span>
              </button>
              {taken && <button className="dose-edit" onClick={() => onEditDay(todayKey())} aria-label="Edit time taken"><Ico n="clock" s={18} /></button>}
            </div>
          );
        })}
        {complete && <p className="all-done">Both doses done. Nice and steady.</p>}
      </div>
      <button className="dose-banner" onClick={onDosage}>
        <span className="db-left">
          <span className="db-ic"><Ico n="pill" s={16} /></span>
          <span className="db-text"><span className="db-cur">Current dosage</span><span className="db-val">{regimenText(reg)}</span></span>
        </span>
        <span className="db-link">Change ›</span>

        </section>

      <Disclaimer />
    </div>

}

function BreathRing({ taken, total }) {
  const pct = (taken / total) * 100; const complete = taken === total;
  return (
    <div className="ring-area">
      <div className={`ring-wrap ${complete ? "" : "pulsing"}`}>
        <svg viewBox="0 0 180 180" className="ring">

          {complete ? <span className="ring-check"><Ico n="check" s={40} /></span> : <span className="ring-num">{taken}<span className="ring-den">/{total}</span></span>}

        </div>
      </div>
    </div>
  );
}

/* ---------- History (month calendar) ---------- */
const MONTH_FULL = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const WD = ["S", "M", "T", "W", "T", "F", "S"];

function History({ data, onOpenEpisode, onEditDay }) {
  const relieverDays = useMemo(() => {
    const s = new Set();
    for (const e of data.episodes) if (Number(e.reliever) > 0) s.add(keyOf(new Date(e.at)));
    return s;
  }, [data]);
  const episodeDays = useMemo(() => {
    const m = {};
    for (const e of data.episodes) { const k = keyOf(new Date(e.at)); m[k] = (m[k] || 0) + 1; }
    return m;
  }, [data]);
  const firstActive = useMemo(() => {
    const keys = [...Object.keys(data.doseLog), ...data.episodes.map((e) => keyOf(new Date(e.at)))].sort();
    return keys.length ? keys[0] : todayKey();
  }, [data]);
  const changeDays = useMemo(() => new Set(regimenSorted(data.regimen).slice(1).map((r) => r.from)), [data]);

  const today = new Date();
  const tkey = todayKey();
  const [view, setView] = useState({ y: today.getFullYear(), m: today.getMonth() });
  const canNext = view.y < today.getFullYear() || (view.y === today.getFullYear() && view.m < today.getMonth());
  function shift(delta) { setView((v) => { const d = new Date(v.y, v.m + delta, 1); return { y: d.getFullYear(), m: d.getMonth() }; }); }

  const cells = useMemo(() => {
    const first = new Date(view.y, view.m, 1);
    const lead = first.getDay();
    const dim = new Date(view.y, view.m + 1, 0).getDate();
    const arr = [];
    for (let i = 0; i < lead; i++) arr.push(null);
    for (let day = 1; day <= dim; day++) arr.push(new Date(view.y, view.m, day));
    while (arr.length % 7 !== 0) arr.push(null);
    return arr;
  }, [view]);

  const episodes = useMemo(() => [...data.episodes].sort((a, b) => new Date(b.at) - new Date(a.at)), [data]);

  return (
    <div className="screen">
      <header className="head"><p className="eyebrow">Calendar</p><h1 className="title">History</h1></header>
      <section className="card">
        <div className="cal-head">
          <button className="cal-nav" onClick={() => shift(-1)} aria-label="Previous month">‹</button>
          <span className="cal-title">{MONTH_FULL[view.m]} {view.y}</span>
          <button className="cal-nav" onClick={() => shift(1)} disabled={!canNext} aria-label="Next month">›</button>
        </div>
        <div className="cal-wd">{WD.map((w, i) => <span key={i}>{w}</span>)}</div>
        <div className="cal-grid">
          {cells.map((date, i) => {
            if (!date) return <span key={i} className="cal-cell empty" />;
            const k = keyOf(date);
            const log = data.doseLog[k] || {};
            const taken = DOSES.filter((x) => log[x.id] && log[x.id].taken).length;
            const future = k > tkey;
            const tracked = k >= firstActive && !future;
            let cls;
            if (future) cls = "future";
            else if (!tracked) cls = "pre";
            else if (taken === 2) cls = "both";
            else if (taken === 1) cls = "one";
            else cls = k === tkey ? "pre" : "none";
            return (
              <button key={i} className={`cal-cell ${k === tkey ? "today" : ""} ${future ? "isfuture" : ""}`} disabled={future} onClick={() => onEditDay(k)}>
                {changeDays.has(k) && <span className="cal-rx"><Ico n="pill" s={9} /></span>}
                <span className={`cal-num ${relieverDays.has(k) ? "lev" : ""}`}>{date.getDate()}</span>
                <span className={`cal-bar ${cls}`} />
                <span className={`cal-dot ${episodeDays[k] ? "on" : ""}`} />
              </button>
            );
          })}
        </div>
        <div className="legend">
          <span className="leg"><span className="leg-bar both" /> Both doses</span>
          <span className="leg"><span className="leg-bar one" /> One dose</span>
          <span className="leg"><span className="leg-bar none" /> None</span>
          <span className="leg"><span className="leg-date">12</span> Levolin</span>
          <span className="leg"><span className="leg-dot" /> Episode</span>
          <span className="leg"><span className="leg-rx"><Ico n="pill" s={10} /></span> Dose change</span>
        </div>
        <p className="strip-key">Tap any day to view or correct its Foracort doses · use ‹ › to change month</p>
      </section>
      <section className="ep-list">
        <h2 className="section-h">Episodes</h2>
        {episodes.length === 0 && <p className="empty">No episodes logged yet. That's good news.</p>}
        {episodes.map((e) => <EpisodeRow key={e.id} ep={e} showDate onClick={() => onOpenEpisode(e)} />)}
      </section>
    </div>
  );
}

function EpisodeRow({ ep, showDate, onClick }) {
  const sev = SEVERITIES.find((s) => s.id === ep.severity) || SEVERITIES[0];
  const d = new Date(ep.at);
  const hasLoc = ep.place || ep.geo;

          </span>
        </span>
        <span className="ep-sub">
          {(ep.activities && ep.activities.length) ? ep.activities.slice(0, 2).join(", ") : (ep.symptoms && ep.symptoms.length ? ep.symptoms.slice(0, 2).join(", ") : "—")}
