/* ---------- Summary ---------- */
const RANGES = [{ id: 7, label: "7 days" }, { id: 30, label: "30 days" }, { id: 90, label: "90 days" }, { id: 0, label: "All" }];

function Summary({ data, onRestore, showToast }) {
  const [range, setRange] = useState(30);
  const [copied, setCopied] = useState(false);
  const fileRef = useRef(null);

  const stats = useMemo(() => computeStats(data, range), [data, range]);
  const text = useMemo(() => buildReport(stats, range), [stats, range]);

  async function copy() {
    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(() => setCopied(false), 1800); } catch (e) { showToast("Couldn't copy — select the text below instead", true); }
  }
  async function share() {
    try { if (navigator.share) await navigator.share({ title: `${CHILD} — asthma summary`, text }); else copy(); } catch (e) {}
  }
  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `zoya-asthma-backup-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast("Backup downloaded");
    } catch (e) { showToast("Couldn't export backup", true); }
  }
  function onFile(e) {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { const obj = JSON.parse(r.result); if (window.confirm("Replace all current records with this backup file?")) onRestore(obj); }
      catch (err) { showToast("Couldn't read that file", true); }
    };
    r.readAsText(f); e.target.value = "";
  }

  return (
    <div className="screen">
      <header className="head"><p className="eyebrow">For the doctor</p><h1 className="title">Summary</h1></header>
      <div className="range-row">
        {RANGES.map((r) => <button key={r.id} className={`range-chip ${range === r.id ? "sel" : ""}`} onClick={() => setRange(r.id)}>{r.label}</button>)}
      </div>

      <section className="card stat-grid">
        <Stat big value={`${stats.adherence}%`} label="Preventer adherence" />
        <Stat value={`${stats.given}/${stats.expected}`} label="Doses taken" />
        <Stat value={stats.missed} label="Doses missed" />
        <Stat value={stats.episodes.length} label="Episodes" />
        <Stat value={stats.relieverTotal} label="Levolin puffs" />
      </section>

      {stats.episodes.length > 0 && (
        <section className="card">
          <h2 className="section-h">Episodes breakdown</h2>
          <div className="sev-bars">
            {SEVERITIES.map((s) => {
              const n = stats.sevCount[s.id] || 0; const w = stats.episodes.length ? (n / stats.episodes.length) * 100 : 0;
              return (<div key={s.id} className="sev-line"><span className="sev-name">{s.label}</span><span className="sev-track"><span className="sev-fill" style={{ width: `${w}%`, background: s.color }} /></span><span className="sev-n">{n}</span></div>);
            })}
          </div>
          {stats.topActivities.length > 0 && <p className="meta-line"><strong>At onset:</strong> {stats.topActivities.map((a) => `${a[0]} (${a[1]})`).join(", ")}</p>}
          {stats.topSymptoms.length > 0 && <p className="meta-line"><strong>Symptoms:</strong> {stats.topSymptoms.map((a) => a[0]).join(", ")}</p>}
        </section>
      )}

      {stats.pefPoints.length > 1 && (
        <section className="card">
          <h2 className="section-h">Peak flow (PEF)</h2>
          <Sparkline points={stats.pefPoints} />
          <div className="spark-meta"><span>Low {Math.min(...stats.pefPoints.map((p) => p.pef))}</span><span>Latest {stats.pefPoints[stats.pefPoints.length - 1].pef}</span><span>High {Math.max(...stats.pefPoints.map((p) => p.pef))}</span></div>
        </section>
      )}

      <div className="report-actions">
        <button className="primary" onClick={share}><Ico n="share" s={17} /> Share</button>
        <button className="ghost" onClick={copy}><Ico n="copy" s={16} /> {copied ? "Copied" : "Copy text"}</button>
      </div>

      <section className="card report-preview"><h2 className="section-h">Report preview</h2><pre className="report-text">{text}</pre></section>

      <section className="card">
        <h2 className="section-h">Backup</h2>
        <div className="backup-row">
          <button className="ghost" onClick={exportBackup}><Ico n="download" s={16} /> Export</button>
          <button className="ghost" onClick={() => fileRef.current && fileRef.current.click()}><Ico n="upload" s={16} /> Restore</button>
        </div>
        <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={onFile} />
        <p className="backup-note">Export saves a file with every dose and episode — keep it somewhere safe, or use it to move records to another phone. Restore replaces everything currently in the app.</p>
      </section>
    </div>
  );
}

function Stat({ value, label, big }) {
  return <div className={`stat ${big ? "stat-big" : ""}`}><span className="stat-val">{value}</span><span className="stat-lab">{label}</span></div>;
}

function Sparkline({ points }) {
  const vals = points.map((p) => p.pef);
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const W = 320, H = 96, padX = 10, padY = 12;
  const step = points.length > 1 ? (W - 2 * padX) / (points.length - 1) : 0;
  const pts = points.map((p, i) => [padX + i * step, H - padY - ((p.pef - min) / span) * (H - 2 * padY)]);
  const d = pts.map((c, i) => (i ? "L" : "M") + c[0].toFixed(1) + " " + c[1].toFixed(1)).join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="spark" preserveAspectRatio="none">
      <path d={d} fill="none" stroke="#1F6159" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {pts.map((c, i) => <circle key={i} cx={c[0]} cy={c[1]} r="3.5" fill="#1F6159" />)}
    </svg>
  );
}

function computeStats(data, range) {
  const now = new Date(); let start = null;
  if (range > 0) { start = new Date(now); start.setDate(now.getDate() - (range - 1)); start.setHours(0, 0, 0, 0); }
  let given = 0, expectedDays = 0;
  const dayKeys = Object.keys(data.doseLog);
  if (range > 0) expectedDays = range;
  else {
    const allDates = [...dayKeys, ...data.episodes.map((e) => keyOf(new Date(e.at)))].sort();
    if (allDates.length) { const first = new Date(allDates[0] + "T00:00:00"); expectedDays = Math.floor((now - first) / 86400000) + 1; }
    else expectedDays = 1;
  }
  for (const k of dayKeys) {
    const d = new Date(k + "T00:00:00");
    if (start && d < start) continue; if (d > now) continue;
    const log = data.doseLog[k]; given += DOSES.filter((x) => log[x.id] && log[x.id].taken).length;
  }
  const expected = Math.max(expectedDays * DOSES.length, given);
  const missed = Math.max(expected - given, 0);
  const adherence = expected ? Math.round((given / expected) * 100) : 0;
  const episodes = data.episodes.filter((e) => !start || new Date(e.at) >= start).sort((a, b) => new Date(a.at) - new Date(b.at));
  const sevCount = {}, actCount = {}, symCount = {}; let relieverTotal = 0; const pefRaw = [];
  for (const e of episodes) {
    sevCount[e.severity] = (sevCount[e.severity] || 0) + 1;
    (e.activities || []).forEach((a) => { actCount[a] = (actCount[a] || 0) + 1; });
    (e.symptoms || []).forEach((s) => { symCount[s] = (symCount[s] || 0) + 1; });
    relieverTotal += Number(e.reliever || 0);
    if (e.pef) pefRaw.push({ t: new Date(e.at), pef: Number(e.pef) });
  }
  (data.pefReadings || []).forEach((r) => {
    const t = new Date(r.at);
    if (!start || t >= start) pefRaw.push({ t, pef: Number(r.value) });
  });
  pefRaw.sort((a, b) => a.t - b.t);
  const pefPoints = pefRaw.map((p) => ({ label: `${p.t.getDate()}/${p.t.getMonth() + 1}`, pef: p.pef }));
  const top = (obj, n) => Object.entries(obj).sort((a, b) => b[1] - a[1]).slice(0, n);
  return { given, expected, missed, adherence, episodes, sevCount, relieverTotal, topActivities: top(actCount, 3), topSymptoms: top(symCount, 4), pefPoints, start, now, regimen: data.regimen };
}

function buildReport(s, range) {
  const fmt = (d) => `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  const header = range === 0 ? `${CHILD} — Asthma summary (all records to ${fmt(s.now)})` : `${CHILD} — Asthma summary (${fmt(s.start)} – ${fmt(s.now)})`;
  const reg = regimenSorted(s.regimen);
  const lines = [header, "", "PREVENTER — Foracort"];
  if (reg.length) {
    const cur = reg[reg.length - 1];
    const fmtK = (k) => { const d = new Date(k + "T00:00:00"); return fmt(d); };
    lines.push(`  Current dose: ${regimenText(cur)} (${reg.length > 1 ? "changed" : "since"} ${fmtK(cur.from)})`);
    for (let i = reg.length - 2; i >= 0; i--) {
      const end = new Date(reg[i + 1].from + "T00:00:00"); end.setDate(end.getDate() - 1);
      lines.push(`  Earlier: ${regimenText(reg[i])} (${fmtK(reg[i].from)} – ${fmt(end)})`);
    }
  }
  lines.push(`  Adherence: ${s.adherence}%  (${s.given} of ${s.expected} doses)`, `  Doses missed: ${s.missed}`, "", `EPISODES: ${s.episodes.length}`);
  if (s.episodes.length) {
    lines.push(`  Severity — ${SEVERITIES.map((x) => `${x.label} ${s.sevCount[x.id] || 0}`).join(", ")}`);
    lines.push(`  Reliever (Levolin) puffs used: ${s.relieverTotal}`);
    if (s.topActivities.length) lines.push(`  At onset: ${s.topActivities.map((a) => `${a[0]} (${a[1]})`).join(", ")}`);
    if (s.topSymptoms.length) lines.push(`  Common symptoms: ${s.topSymptoms.map((a) => a[0]).join(", ")}`);
    if (s.pefPoints.length) { const v = s.pefPoints.map((p) => p.pef); lines.push(`  Peak flow: ${Math.min(...v)}–${Math.max(...v)} (latest ${v[v.length - 1]})`); }
    lines.push("", "DETAIL");
    for (const e of s.episodes) {
      const d = new Date(e.at); const sev = (SEVERITIES.find((x) => x.id === e.severity) || {}).label;
      let line = `  ${d.getDate()} ${MONTHS[d.getMonth()]} ${prettyTime(e.at)} — ${sev}`;
      if (e.activities && e.activities.length) line += `; doing: ${e.activities.join(", ")}`;
      if (e.place) line += `; at: ${e.place}`; else if (e.geo) line += `; at: ${e.geo.lat},${e.geo.lng}`;
      if (e.symptoms && e.symptoms.length) line += `; ${e.symptoms.join(", ")}`;
      if (e.reliever) line += `; Levolin ${e.reliever} puff(s)`;
      if (e.pef) line += `; PEF ${e.pef}`;
      if (e.notes) line += `; note: ${e.notes}`;
      lines.push(line);
    }
  }
  lines.push("", "Logged with a home tracker — not a clinical record.");
  return lines.join("\n");
}

/* ---------- Episode sheet ---------- */
function EpisodeSheet({ existing, onClose, onSave, onDelete }) {
  const [at, setAt] = useState(existing ? isoLocalInput(new Date(existing.at)) : isoLocalInput(new Date()));
  const [severity, setSeverity] = useState((existing && existing.severity) || "mild");
  const [symptoms, setSymptoms] = useState((existing && existing.symptoms) || []);
  const [activities, setActivities] = useState((existing && existing.activities) || []);
  const [reliever, setReliever] = useState((existing && existing.reliever) || 0);
  const [pef, setPef] = useState((existing && existing.pef) || "");
  const [notes, setNotes] = useState((existing && existing.notes) || "");
  const [place, setPlace] = useState((existing && existing.place) || "");
  const [geo, setGeo] = useState((existing && existing.geo) || null);
  const [geoStatus, setGeoStatus] = useState("");

  const toggle = (list, set, v) => set(list.includes(v) ? list.filter((x) => x !== v) : [...list, v]);

  function tagLocation() {
    if (!navigator.geolocation) { setGeoStatus("Location isn't available here — type the place instead."); return; }
    setGeoStatus("locating");
    navigator.geolocation.getCurrentPosition(
      (pos) => { setGeo({ lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6), acc: Math.round(pos.coords.accuracy) }); setGeoStatus(""); },
      (err) => { setGeoStatus(err.code === 1 ? "Location permission was denied — type the place instead." : "Couldn't get a fix — type the place instead."); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
    );
  }
  function save() {
    onSave({ id: existing && existing.id, at: new Date(at).toISOString(), severity, symptoms, activities, reliever: Number(reliever) || 0, pef: pef === "" ? null : Number(pef), notes: notes.trim(), place: place.trim(), geo });
  }

  return (
    <div className="sheet-scrim">
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <button className="cancel-btn" onClick={onClose}>Cancel</button>
          <h2>{existing ? "Edit episode" : "Log episode"}</h2>
          <button className="text-btn" onClick={save}>Save</button>
        </div>
        <div className="sheet-body">
          <Field label="When"><input className="dt-input" type="datetime-local" value={at} onChange={(e) => setAt(e.target.value)} /></Field>
          <Field label="Where">
            <input className="dt-input" type="text" placeholder="e.g. School playground" value={place} onChange={(e) => setPlace(e.target.value)} />
            <button type="button" className="geo-btn" onClick={tagLocation}><Ico n="pin" s={15} />{geoStatus === "locating" ? "Locating…" : geo ? "Update GPS pin" : "Tag current location"}</button>
            {geo && (
              <div className="geo-chip">
                <span><Ico n="pin" s={13} /> {geo.lat}, {geo.lng}<span className="geo-acc"> ±{geo.acc}m</span></span>
                <span className="geo-links">
                  <a href={`https://www.google.com/maps?q=${geo.lat},${geo.lng}`} target="_blank" rel="noreferrer">Map</a>
                  <button type="button" onClick={() => { setGeo(null); setGeoStatus(""); }}>Clear</button>
                </span>
              </div>
            )}
            {geoStatus && geoStatus !== "locating" && <p className="geo-note">{geoStatus}</p>}
          </Field>
          <Field label="Severity">
            <div className="chips">
              {SEVERITIES.map((s) => (
                <button key={s.id} className={`chip sev-chip ${severity === s.id ? "on" : ""}`} style={severity === s.id ? { background: s.color, borderColor: s.color, color: "#fff" } : {}} onClick={() => setSeverity(s.id)}>
                  <span className="sev-dot" style={{ background: s.color }} />{s.label}
                </button>
              ))}
            </div>
          </Field>
          <Field label="What was she doing?"><div className="chips">{ACTIVITIES.map((a) => <button key={a} className={`chip ${activities.includes(a) ? "on" : ""}`} onClick={() => toggle(activities, setActivities, a)}>{a}</button>)}</div></Field>
          <Field label="Symptoms"><div className="chips">{SYMPTOMS.map((s) => <button key={s} className={`chip ${symptoms.includes(s) ? "on" : ""}`} onClick={() => toggle(symptoms, setSymptoms, s)}>{s}</button>)}</div></Field>
          <Field label="Reliever — Levolin puffs"><div className="stepper"><button onClick={() => setReliever(Math.max(0, reliever - 1))}>−</button><span>{reliever}</span><button onClick={() => setReliever(reliever + 1)}>+</button></div></Field>
          <Field label="Peak flow (PEF) — optional"><input className="num-input" type="number" inputMode="numeric" placeholder="e.g. 220" value={pef} onChange={(e) => setPef(e.target.value)} /></Field>
          <Field label="Notes — optional"><textarea className="notes-input" rows={3} placeholder="Anything else worth remembering" value={notes} onChange={(e) => setNotes(e.target.value)} /></Field>
          {existing && <button className="delete-btn" onClick={() => onDelete(existing.id)}><Ico n="trash" s={16} /> Delete this episode</button>}
        </div>
      </div>
    </div>
  );
}

function PefChart({ points, best }) {
  const vals = points.map((p) => p.value);
  const ref = best && best > 0 ? best : Math.max(...vals);
  const maxV = Math.max(...vals, ref);
  const minV = Math.min(...vals, ref * 0.5);
  const yMax = Math.min(800, Math.ceil((maxV + 15) / 10) * 10);
  const yMin = Math.max(0, Math.floor((minV - 15) / 10) * 10);
  const span = (yMax - yMin) || 1;
  const W = 320, H = 190, padL = 36, padR = 10, padT = 12, padB = 24;
  const iw = W - padL - padR, ih = H - padT - padB;
  const n = points.length;
  const x = (i) => padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = (v) => padT + ih - ((v - yMin) / span) * ih;
  const cy = (v) => Math.max(padT, Math.min(padT + ih, y(v)));
  const line = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.value).toFixed(1)).join(" ");
  const gridVals = [yMin, Math.round((yMin + yMax) / 2), yMax];
  const xIdx = n <= 1 ? [0] : [0, Math.floor((n - 1) / 2), n - 1];
  const zTop = 0.8 * ref, zMid = 0.5 * ref;
  const band = (v1, v2, fill, key) => { const yt = cy(v2), yb = cy(v1); return yb - yt < 0.5 ? null : <rect key={key} x={padL} y={yt} width={iw} height={yb - yt} fill={fill} />; };
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="pef-chart" preserveAspectRatio="xMidYMid meet">
      {ref > 0 && band(zTop, yMax, "rgba(62,107,58,.12)", "g")}
      {ref > 0 && band(zMid, zTop, "rgba(215,154,43,.15)", "a")}
      {ref > 0 && band(yMin, zMid, "rgba(183,50,80,.10)", "r")}
      {gridVals.map((gv, i) => (
        <g key={i}>
          <line x1={padL} y1={y(gv)} x2={W - padR} y2={y(gv)} stroke="#DCE2CC" strokeWidth="1" />
          <text x={padL - 6} y={y(gv) + 3} textAnchor="end" fontSize="9" fill="#68705C">{gv}</text>
        </g>
      ))}
      {ref > 0 && <line x1={padL} y1={cy(ref)} x2={W - padR} y2={cy(ref)} stroke="#D79A2B" strokeWidth="1.5" strokeDasharray="4 3" />}
      {ref > 0 && <text x={W - padR} y={cy(ref) - 4} textAnchor="end" fontSize="8.5" fill="#D79A2B">best</text>}
      <path d={line} fill="none" stroke="#1F6159" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.value)} r="3.2" fill="#1F6159" />)}
      {xIdx.map((idx, i) => <text key={i} x={x(idx)} y={H - 8} textAnchor="middle" fontSize="9" fill="#68705C">{points[idx].label}</text>)}
    </svg>
  );
}

function PeakFlow({ readings, pefBest, onSave, onDelete, onSaveBest, showToast }) {
  const [value, setValue] = useState("");
  const [date, setDate] = useState(todayKey());
  const [editId, setEditId] = useState(null);
  const [bestField, setBestField] = useState(pefBest == null ? "" : String(pefBest));
  useEffect(() => { setBestField(pefBest == null ? "" : String(pefBest)); }, [pefBest]);

  const sorted = useMemo(() => [...readings].sort((a, b) => new Date(a.at) - new Date(b.at)), [readings]);
  const points = sorted.map((r) => { const d = new Date(r.at); return { value: Number(r.value), label: `${d.getDate()}/${d.getMonth() + 1}` }; });
  const vals = points.map((p) => p.value);
  const maxReading = vals.length ? Math.max(...vals) : null;
  const latest = vals.length ? vals[vals.length - 1] : null;
  const ref = (pefBest && Number(pefBest) > 0) ? Number(pefBest) : maxReading;
  const zTop = ref ? Math.round(0.8 * ref) : null;
  const zMid = ref ? Math.round(0.5 * ref) : null;
  const latestPct = (latest && ref) ? Math.round((latest / ref) * 100) : null;

  function save() {
    const v = Number(value);
    if (!v || v <= 0) { showToast("Enter a peak flow value", true); return; }
    if (v < 60 || v > 800) { showToast("This meter reads 60–800 L/min — please check", true); return; }
    onSave({ id: editId, at: new Date(date + "T12:00:00").toISOString(), value: v });
    setValue(""); setDate(todayKey()); setEditId(null);
  }
  function startEdit(r) { setEditId(r.id); setValue(String(r.value)); setDate(keyOf(new Date(r.at))); }
  function cancelEdit() { setEditId(null); setValue(""); setDate(todayKey()); }
  function commitBest() {
    if (bestField === "") { onSaveBest(null); return; }
    const b = Number(bestField);
    if (!b || b < 60 || b > 800) { showToast("Personal best should be 60–800 L/min", true); return; }
    onSaveBest(b);
  }

  const listDesc = [...sorted].reverse();
  return (
    <div className="screen">
      <header className="head"><p className="eyebrow">Rossmax · 60–800 L/min</p><h1 className="title">Peak flow</h1></header>

      <section className="card">
        <h2 className="section-h">{editId ? "Edit reading" : "New reading"}</h2>
        <div className="pef-form">
          <div className="pef-field">
            <label className="field-label">Reading (L/min)</label>
            <input className="num-input" type="number" inputMode="numeric" min="60" max="800" placeholder="60–800" value={value} onChange={(e) => setValue(e.target.value)} />
          </div>
          <div className="pef-field">
            <label className="field-label">Date</label>
            <input className="dt-input" type="date" max={todayKey()} value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
        </div>
        <button className="primary" onClick={save}><Ico n="check" s={17} /> {editId ? "Update reading" : "Save reading"}</button>
        {editId && <button className="ghost" onClick={cancelEdit} style={{ marginTop: "10px" }}>Cancel edit</button>}
      </section>

      <section className="card">
        <h2 className="section-h">Personal best &amp; zones</h2>
        <div className="pb-row">
          <input className="num-input" type="number" inputMode="numeric" min="60" max="800" placeholder="Doctor's best" value={bestField} onChange={(e) => setBestField(e.target.value)} onBlur={commitBest} />
          <span className="pb-unit">L/min</span>
        </div>
        {ref ? (
          <div className="zone-legend">
            <span className="zl"><span className="zl-dot" style={{ background: "var(--green)" }} /> Green ≥ {zTop}</span>
            <span className="zl"><span className="zl-dot" style={{ background: "var(--moderate)" }} /> Amber {zMid}–{zTop}</span>
            <span className="zl"><span className="zl-dot" style={{ background: "var(--severe)" }} /> Red &lt; {zMid}</span>
          </div>
        ) : <p className="rem-status" style={{ margin: "8px 0 0" }}>Add a reading or the doctor's best to see her zones.</p>}
        {!pefBest && maxReading ? <p className="rem-status" style={{ margin: "8px 0 0" }}>Using her highest reading ({maxReading}) as a stand-in until you enter the doctor's best.</p> : null}
      </section>

      {points.length >= 2 && (
        <section className="card">
          <h2 className="section-h">Trend</h2>
          <PefChart points={points} best={ref} />
          <div className="spark-meta"><span>Latest {latest}{latestPct ? ` · ${latestPct}%` : ""}</span><span className="pef-best">Best {ref}</span><span>{points.length} readings</span></div>
        </section>
      )}
      {points.length === 1 && <p className="empty">One reading so far ({latest} L/min). Add another to see her trend.</p>}

      <section className="ep-list">
        <h2 className="section-h">All readings</h2>
        {listDesc.length === 0 && <p className="empty">No readings yet. Record her first one above.</p>}
        {listDesc.map((r) => {
          const d = new Date(r.at);
          return (
            <div key={r.id} className="reg-row">
              <button className="reg-main" onClick={() => startEdit(r)}>
                <span className="reg-top">{r.value} <span className="pef-unit">L/min</span></span>
                <span className="reg-when">{d.getDate()} {MONTHS[d.getMonth()]} {d.getFullYear()}</span>
              </button>
              <button className="reg-del" onClick={() => onDelete(r.id)}><Ico n="trash" s={15} /></button>
            </div>
          );
        })}
      </section>
      <p className="disclaimer"><Ico n="alert" s={13} /> Peak flow readings support your doctor's review — they don't replace her asthma action plan.</p>
    </div>
  );
}

function ReminderSheet({ onClose, showToast, enabled, setEnabled }) {
  const [busy, setBusy] = useState(false);
  const supported = triggersSupported();
  const blocked = "Notification" in window && Notification.permission === "denied";

  async function toggle() {
    if (enabled) {
      await clearReminders();
      try { localStorage.setItem(REM_KEY, "0"); } catch (e) {}
      setEnabled(false); showToast("Reminders turned off");
      return;
    }
    setBusy(true);
    const res = await enableReminders();
    setBusy(false);
    if (res.ok) { try { localStorage.setItem(REM_KEY, "1"); } catch (e) {} setEnabled(true); showToast("Reminders on"); }
    else if (res.reason === "denied") showToast("Notifications are blocked — allow them in your browser's site settings, then try again", true);
    else if (res.reason === "notriggers" || res.reason === "unsupported") showToast("This browser can't schedule reminders — use your phone's Clock app instead", true);
    else showToast("Couldn't set reminders", true);
  }
  async function test() {
    const ok = await testNotification();
    showToast(ok ? "Test sent — watch for it in ~5 seconds" : "Couldn't send a test — check notification permission", !ok);
  }

  return (
    <div className="sheet-scrim">
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <button className="cancel-btn" onClick={onClose}>Close</button>
          <h2>Reminders</h2>
          <span style={{ width: 52 }} />
        </div>
        <div className="sheet-body">
          <div className="rem-rows">
            <div className="rem-row"><span><Ico n="sun" s={16} /> Morning · Foracort</span><span>7:00 weekdays · 9:00 weekends</span></div>
            <div className="rem-row"><span><Ico n="moon" s={16} /> Evening · Foracort</span><span>8:00 every day</span></div>
          </div>

          <button className="primary" disabled={busy} onClick={toggle} style={enabled ? { background: "var(--severe)" } : {}}>
            <Ico n="bell" s={17} /> {busy ? "Setting up…" : enabled ? "Turn reminders off" : "Turn reminders on"}
          </button>
          <button className="ghost" onClick={test}>Send a test notification</button>

          <p className="rem-status">
            {enabled
              ? "On — the next two weeks of dose times are scheduled on this phone, and refresh each time you open the app."
              : supported
                ? "Scheduled reminders are supported on this browser."
                : "This browser can't schedule reminders on its own — use your phone's Clock app for the alerts."}
          </p>
          <p className="backup-note">
            These fire on whichever phone you switch them on. They won't ring on the Mac. If you ever stop getting them, just open the app once to top them up{blocked ? ", and re-allow notifications in your browser's site settings" : ""}.
          </p>
        </div>
      </div>
    </div>
  );
}

function readDay(log, k) {
  const day = log[k] || {}; const v = {};
  DOSES.forEach((d) => {
    const rec = day[d.id];
    const taken = !!(rec && rec.taken);
    let time = pad(d.dueHour) + ":00";
    if (taken && rec.at) { const dt = new Date(rec.at); time = pad(dt.getHours()) + ":" + pad(dt.getMinutes()); }
    v[d.id] = { taken, time };
  });
  return v;
}

function DayEditor({ initialKey, doseLog, regimen, onClose, onSave }) {
  const [dateStr, setDateStr] = useState(initialKey || todayKey());
  const [vals, setVals] = useState(() => readDay(doseLog, initialKey || todayKey()));
  useEffect(() => { setVals(readDay(doseLog, dateStr)); }, [dateStr]);
  const d = new Date(dateStr + "T00:00:00");
  const future = dateStr > todayKey();
  const reg = regimenOn(regimen, dateStr);

  return (
    <div className="sheet-scrim">
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <button className="cancel-btn" onClick={onClose}>Cancel</button>
          <h2>Edit doses</h2>
          <button className="text-btn" onClick={() => onSave(dateStr, vals)} disabled={future}>Save</button>
        </div>
        <div className="sheet-body">
          <Field label="Date">
            <input className="dt-input" type="date" max={todayKey()} value={dateStr} onChange={(e) => setDateStr(e.target.value)} />
            <p className="rem-status" style={{ margin: 0 }}>{prettyDate(d)}{future ? " — can't log a future day" : ` · prescribed ${regimenText(reg)}`}</p>
          </Field>
          <Field label="Foracort doses taken">
            {DOSES.map((dose) => {
              const on = !!vals[dose.id].taken;
              const puffs = dose.id === "evening" ? reg.evening : reg.morning;
              return (
                <div key={dose.id} className="dose-group">
                  <div className={`dose ${on ? "done" : ""}`}>
                    <button className="dose-main" onClick={() => setVals((p) => ({ ...p, [dose.id]: { ...p[dose.id], taken: !p[dose.id].taken } }))}>
                      <span className="dose-ic"><Ico n={dose.icon} /></span>
                      <span className="dose-text">
                        <span className="dose-label">{dose.label} · {dose.med}</span>
                        <span className="dose-detail">{on ? `Taken (${puffLabel(puffs)})` : "Not taken"}</span>
                      </span>
                      <span className="dose-check">{on ? <Ico n="check" s={18} /> : <span className="empty-dot" />}</span>
                    </button>
                  </div>
                  {on && (
                    <div className="dose-time">
                      <span className="dose-time-lab"><Ico n="clock" s={14} /> Time taken</span>
                      <input className="dt-input time-in" type="time" value={vals[dose.id].time} onChange={(e) => setVals((p) => ({ ...p, [dose.id]: { ...p[dose.id], time: e.target.value } }))} />
                    </div>
                  )}
                </div>
              );
            })}
          </Field>
          <p className="backup-note">Tap a dose to flip it; adjust the time it was taken below it. The calendar bar updates straight away.</p>
        </div>
      </div>
    </div>
  );
}

function DosageSheet({ regimen, onClose, onSave, onDelete }) {
  const sorted = regimenSorted(regimen);
  const current = sorted[sorted.length - 1] || { morning: 2, evening: 2, from: todayKey() };
  const blank = () => ({ id: null, from: todayKey(), morning: current.morning, evening: current.evening });
  const [changing, setChanging] = useState(false);
  const [form, setForm] = useState(blank);
  const editing = !!form.id;
  const prettyK = (k) => { const d = new Date(k + "T00:00:00"); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
  function periodText(i) {
    const r = sorted[i], next = sorted[i + 1];
    if (!next) return `since ${prettyK(r.from)}`;
    const end = new Date(next.from + "T00:00:00"); end.setDate(end.getDate() - 1);
    return `${prettyK(r.from)} – ${end.getDate()} ${MONTHS[end.getMonth()]} ${end.getFullYear()}`;
  }
  function step(which, delta) { setForm((f) => ({ ...f, [which]: Math.max(1, Math.min(8, Number(f[which]) + delta)) })); }
  function startChange() { setForm(blank()); setChanging(true); }
  function startEdit(r) { setForm({ id: r.id, from: r.from, morning: r.morning, evening: r.evening }); setChanging(true); }
  function cancelChange() { setForm(blank()); setChanging(false); }
  function save() { if (!form.from) return; onSave(form); setForm(blank()); setChanging(false); }
  const rows = sorted.map((r, i) => ({ r, text: periodText(i), current: i === sorted.length - 1 })).reverse();

  return (
    <div className="sheet-scrim">
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="sheet-head">
          <button className="cancel-btn" onClick={onClose}>Close</button>
          <h2>Dosage</h2>
          {changing ? <button className="text-btn" onClick={save}>{editing ? "Update" : "Save"}</button> : <span style={{ width: 52 }} />}
        </div>
        <div className="sheet-body">
          <div className="cur-dose">
            <span className="cur-dose-label">Current dosage</span>
            <span className="cur-dose-val">{regimenText(current)}</span>
            <span className="cur-dose-since">{sorted.length > 1 ? "Changed on" : "In place since"} {prettyK(current.from)}</span>
          </div>

          {!changing && <button className="primary" onClick={startChange}><Ico n="pill" s={17} /> Change dosage</button>}

          {changing && (
            <div className="change-form">
              <div className="change-form-head">{editing ? "Edit dose change" : "New dose change"}<button className="cancel-btn" onClick={cancelChange}>Cancel</button></div>
              <Field label="Date the dosage changed">
                <input className="dt-input" type="date" max={todayKey()} value={form.from} onChange={(e) => setForm((f) => ({ ...f, from: e.target.value }))} />
              </Field>
              <div className="puff-row">
                <div className="puff-col">
                  <span className="field-label"><Ico n="sun" s={14} /> Morning</span>
                  <div className="stepper"><button onClick={() => step("morning", -1)}>−</button><span>{form.morning}</span><button onClick={() => step("morning", 1)}>+</button></div>
                </div>
                <div className="puff-col">
                  <span className="field-label"><Ico n="moon" s={14} /> Evening</span>
                  <div className="stepper"><button onClick={() => step("evening", -1)}>−</button><span>{form.evening}</span><button onClick={() => step("evening", 1)}>+</button></div>
                </div>
              </div>
            </div>
          )}

          <h2 className="section-h" style={{ marginTop: "6px" }}>Dose history</h2>
          <div className="reg-list">
            {rows.map(({ r, text, current: isCur }) => (
              <div key={r.id} className={`reg-row ${form.id === r.id ? "editing" : ""}`}>
                <button className="reg-main" onClick={() => startEdit(r)}>
                  <span className="reg-top">{regimenText(r)}{isCur && <span className="reg-current">Current</span>}</span>
                  <span className="reg-when">{text}</span>
                </button>
                <button className="reg-del" disabled={sorted.length <= 1} onClick={() => { onDelete(r.id); if (form.id === r.id) cancelChange(); }}><Ico n="trash" s={15} /></button>
              </div>
            ))}
          </div>
          <p className="backup-note">Each change applies from its date until the next one. History, reminders, and the doctor summary all use the dose that was in effect on each day.</p>
        </div>
      </div>
    </div>
  );
}

function Field({ label, children }) { return <div className="field"><label className="field-label">{label}</label>{children}</div>; }
function Disclaimer() {
  return <p className="disclaimer"><Ico n="alert" s={13} /> A home logging aid for you and {CHILD}'s doctor — not medical advice. In an emergency, follow her asthma action plan or seek urgent care.</p>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
